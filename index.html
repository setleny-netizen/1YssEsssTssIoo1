<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Тайна Лохматого</title>
    <style>
        /* ─── Общий сброс и фон ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 50%, #1a1a2e, #0a0a12);
            font-family: 'Segoe UI', 'Arial Black', system-ui, sans-serif;
            padding: 1rem;
            transition: background 0.8s ease;
            touch-action: manipulation;
            perspective: 1200px;
        }

        /* ─── Контейнер с 3D-флипом ─── */
        .flip-container {
            width: 100%;
            max-width: 420px;
            perspective: 1200px;
            position: relative;
        }

        .flip-inner {
            position: relative;
            width: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-inner.flipped {
            transform: rotateY(180deg);
        }

        /* ─── Передняя и задняя стороны ─── */
        .flip-front,
        .flip-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            width: 100%;
            border-radius: 3rem;
            padding: 2.5rem 2rem;
            background: rgba(10, 10, 20, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
            transition: all 0.3s ease;
        }

        .flip-front {
            position: relative;
            z-index: 2;
        }

        .flip-back {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotateY(180deg);
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a351a, #0a120a);
            border-color: rgba(127, 255, 127, 0.3);
            box-shadow: 0 0 60px rgba(127, 255, 127, 0.10), 0 30px 60px rgba(0, 0, 0, 0.8);
        }

        /* ─── Задняя сторона (победа) ─── */
        .flip-back h2 {
            font-size: clamp(2rem, 7vw, 3.2rem);
            font-weight: 900;
            background: linear-gradient(145deg, #f0f9ff, #b0d4ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .flip-back .lochmatiy-big {
            font-size: 5rem;
            display: inline-block;
            animation: lochmatiyPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            line-height: 1.2;
            margin: 0.5rem 0;
        }

        .flip-back .victory-text {
            color: #7fff7f;
            font-size: 1.2rem;
            font-weight: 600;
            text-shadow: 0 0 30px rgba(127, 255, 127, 0.3);
            margin-top: 0.5rem;
        }

        @keyframes lochmatiyPop {
            0% {
                transform: scale(0) rotate(-20deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* ─── Заголовок ─── */
        .flip-front h1 {
            font-size: clamp(2rem, 7vw, 3.2rem);
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: linear-gradient(145deg, #f0f9ff, #b0d4ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
            margin-bottom: 1.5rem;
        }

        /* ─── Поле ввода ─── */
        .input-group {
            display: flex;
            gap: 0.7rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .digit-input {
            width: 65px;
            height: 80px;
            font-size: 2.6rem;
            font-weight: 700;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.2rem;
            color: #fff;
            outline: none;
            transition: all 0.2s ease;
            font-family: 'Segoe UI', monospace;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .digit-input.active {
            border-color: #7fff7f;
            box-shadow: 0 0 20px rgba(127, 255, 127, 0.12);
            animation: cursorBlink 1s step-end infinite;
        }

        @keyframes cursorBlink {
            0%, 100% { border-color: #7fff7f; }
            50% { border-color: rgba(127, 255, 127, 0.2); }
        }

        .digit-input.filled {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
        }

        .digit-input::placeholder {
            color: rgba(255, 255, 255, 0.15);
            font-size: 1.2rem;
        }

        /* ─── Цифровая клавиатура 3×4 ─── */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
            max-width: 320px;
            margin: 0 auto 1rem;
        }

        .key-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 1rem;
            padding: 0.9rem 0;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: all 0.12s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
            touch-action: manipulation;
            -webkit-touch-callout: none;
        }

        .key-btn:active {
            transform: scale(0.90);
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .key-btn:focus {
            outline: none;
        }

        .key-btn.backspace {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .key-btn.empty {
            visibility: hidden;
            pointer-events: none;
        }

        .key-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        /* ─── Кнопка проверки ─── */
        .btn-check {
            background: linear-gradient(145deg, #2a2a4a, #1a1a2e);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            padding: 0.8rem 2.5rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 320px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-check:active {
            transform: scale(0.96);
        }

        .btn-check:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ─── Сообщение об ошибке ─── */
        .message {
            min-height: 2.8rem;
            margin-top: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .message.error {
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 80, 80, 0.25);
        }

        /* ─── Фон при победе ─── */
        body.victory-bg {
            background: radial-gradient(circle at 50% 50%, #1a351a, #0a120a);
        }

        body.error-bg {
            background: radial-gradient(circle at 50% 50%, #351a1a, #120a0a);
            animation: errorFlash 0.4s ease 2;
        }

        @keyframes errorFlash {
            0%, 100% { background: radial-gradient(circle at 50% 50%, #351a1a, #120a0a); }
            50% { background: radial-gradient(circle at 50% 50%, #4a2222, #1a0a0a); }
        }

        /* ─── Фейерверк ─── */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 999;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            opacity: 0;
            animation: confettiDrop linear forwards;
        }

        @keyframes confettiDrop {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0;
            }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* ─── Адаптив ─── */
        @media (max-width: 480px) {
            .flip-front,
            .flip-back {
                padding: 1.8rem 1.2rem;
                border-radius: 2rem;
            }
            .digit-input {
                width: 55px;
                height: 68px;
                font-size: 2.2rem;
            }
            .key-btn {
                padding: 0.7rem 0;
                font-size: 1.5rem;
                border-radius: 0.8rem;
            }
            .key-btn.backspace {
                font-size: 1rem;
            }
            .btn-check {
                padding: 0.7rem 1.5rem;
                font-size: 0.9rem;
            }
            .flip-back .lochmatiy-big {
                font-size: 3.5rem;
            }
        }

        @media (max-width: 380px) {
            .digit-input {
                width: 45px;
                height: 58px;
                font-size: 1.8rem;
            }
            .key-btn {
                padding: 0.5rem 0;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="flip-container">
        <div class="flip-inner" id="flipInner">

            <!-- ПЕРЕДНЯЯ СТОРОНА (кодовый замок) -->
            <div class="flip-front">
                <h1>Секретный код</h1>

                <div class="input-group" id="inputGroup">
                    <input type="text" class="digit-input active" id="d1" maxlength="1" placeholder="•" readonly />
                    <input type="text" class="digit-input" id="d2" maxlength="1" placeholder="•" readonly />
                    <input type="text" class="digit-input" id="d3" maxlength="1" placeholder="•" readonly />
                    <input type="text" class="digit-input" id="d4" maxlength="1" placeholder="•" readonly />
                </div>

                <div class="keypad" id="keypad">
                    <button class="key-btn" data-value="1">1</button>
                    <button class="key-btn" data-value="2">2</button>
                    <button class="key-btn" data-value="3">3</button>
                    <button class="key-btn" data-value="4">4</button>
                    <button class="key-btn" data-value="5">5</button>
                    <button class="key-btn" data-value="6">6</button>
                    <button class="key-btn" data-value="7">7</button>
                    <button class="key-btn" data-value="8">8</button>
                    <button class="key-btn" data-value="9">9</button>
                    <button class="key-btn empty"></button>
                    <button class="key-btn" data-value="0">0</button>
                    <button class="key-btn backspace" data-value="backspace">⌫</button>
                </div>

                <button class="btn-check" id="checkBtn">Проверить</button>
                <div class="message" id="message"></div>
            </div>

            <!-- ЗАДНЯЯ СТОРОНА (победа) -->
            <div class="flip-back" id="flipBack">
                <h2>🍦 Лохматый</h2>
                <span class="lochmatiy-big">🐻‍❄️</span>
                <div class="victory-text">соскучился по мороженому! ❄️</div>
            </div>

        </div>
    </div>

    <!-- Фейерверк -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- Звуки -->
    <audio id="winSound" preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
    </audio>
    <audio id="errorSound" preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/error-03.mp3" type="audio/mpeg">
    </audio>

    <script>
        (function() {
            // ─── ⚡ КОД (поменяй на свой) ⚡ ───
            const SECRET_CODE = '8848';

            const inputs = [
                document.getElementById('d1'),
                document.getElementById('d2'),
                document.getElementById('d3'),
                document.getElementById('d4')
            ];
            const checkBtn = document.getElementById('checkBtn');
            const messageEl = document.getElementById('message');
            const body = document.body;
            const confettiContainer = document.getElementById('confettiContainer');
            const winSound = document.getElementById('winSound');
            const errorSound = document.getElementById('errorSound');
            const keyButtons = document.querySelectorAll('.key-btn[data-value]');
            const flipInner = document.getElementById('flipInner');

            let victoryActive = false;

            // ─── Обновить активный курсор ───
            function updateCursor() {
                let firstEmpty = -1;
                for (let i = 0; i < inputs.length; i++) {
                    if (inputs[i].value === '') {
                        firstEmpty = i;
                        break;
                    }
                }
                if (firstEmpty === -1) firstEmpty = inputs.length - 1;

                inputs.forEach((inp, idx) => {
                    inp.classList.remove('active');
                    if (idx === firstEmpty) {
                        inp.classList.add('active');
                    }
                });
            }

            // ─── Вставить цифру ───
            function insertDigit(value) {
                if (victoryActive) return;

                for (let i = 0; i < inputs.length; i++) {
                    if (inputs[i].value === '') {
                        inputs[i].value = value;
                        inputs[i].classList.add('filled');
                        updateCursor();
                        return;
                    }
                }
            }

            // ─── Удалить последнюю цифру ───
            function deleteLast() {
                if (victoryActive) return;

                for (let i = inputs.length - 1; i >= 0; i--) {
                    if (inputs[i].value !== '') {
                        inputs[i].value = '';
                        inputs[i].classList.remove('filled');
                        updateCursor();
                        return;
                    }
                }
                updateCursor();
            }

            // ─── Обработка кнопок клавиатуры ───
            keyButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const value = btn.dataset.value;
                    if (value === 'backspace') {
                        deleteLast();
                    } else {
                        insertDigit(value);
                    }
                });
            });

            // ─── Инициализация ───
            updateCursor();

            // ─── Проверка кода ───
            function checkCode() {
                if (victoryActive) return;

                const code = inputs.map(inp => inp.value).join('');

                if (code.length < 4) {
                    messageEl.textContent = '❄️ Введи все 4 цифры';
                    messageEl.className = 'message error';
                    errorSound.play();
                    return;
                }

                if (code === SECRET_CODE) {
                    // ─── 🏆 ПОБЕДА — ФЛИП! ───
                    victoryActive = true;

                    // Переворачиваем карту
                    flipInner.classList.add('flipped');

                    // Фон
                    body.classList.add('victory-bg');

                    // Фейерверк
                    setTimeout(() => launchConfetti(), 300);

                    // Звук
                    setTimeout(() => winSound.play(), 400);

                    // Блокируем всё
                    checkBtn.disabled = true;
                    inputs.forEach(inp => {
                        inp.style.borderColor = '#7fff7f';
                        inp.style.color = '#7fff7f';
                        inp.classList.remove('active');
                    });
                    keyButtons.forEach(b => b.classList.add('disabled'));

                    // Скрываем сообщение об ошибке
                    messageEl.textContent = '';

                } else {
                    // ─── ❌ ОШИБКА ───
                    messageEl.textContent = '❌ Неверный код. Попробуй снова.';
                    messageEl.className = 'message error';

                    body.classList.add('error-bg');
                    errorSound.play();

                    inputs.forEach(inp => {
                        inp.style.borderColor = '#ff6b6b';
                        inp.style.animation = 'shake 0.35s ease';
                    });

                    setTimeout(() => {
                        body.classList.remove('error-bg');
                        inputs.forEach(inp => {
                            inp.style.borderColor = 'rgba(255,255,255,0.12)';
                            inp.style.animation = '';
                        });
                    }, 400);

                    setTimeout(() => {
                        inputs.forEach(inp => {
                            inp.value = '';
                            inp.classList.remove('filled');
                        });
                        updateCursor();
                    }, 600);
                }
            }

            checkBtn.addEventListener('click', checkCode);

            // ─── 🎆 Фейерверк ───
            function launchConfetti() {
                const colors = ['#7fff7f', '#ff6b6b', '#ffd93d', '#6bcfff', '#ff6bff', '#ff9f43', '#a29bfe'];
                confettiContainer.innerHTML = '';

                for (let i = 0; i < 130; i++) {
                    const el = document.createElement('div');
                    el.className = 'confetti';
                    const size = 6 + Math.random() * 10;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const left = Math.random() * 100;
                    const delay = Math.random() * 1.5;
                    const duration = 1.8 + Math.random() * 2.2;

                    el.style.cssText = `
                        left: ${left}%;
                        width: ${size}px;
                        height: ${size * 0.6}px;
                        background: ${color};
                        animation-delay: ${delay}s;
                        animation-duration: ${duration}s;
                        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                    `;
                    confettiContainer.appendChild(el);
                }

                setTimeout(() => {
                    confettiContainer.innerHTML = '';
                }, 5000);
            }

            // ─── Анимация тряски ───
            const styleShake = document.createElement('style');
            styleShake.textContent = `
                @keyframes shake {
                    0%, 100% { transform: translateX(0); }
                    25% { transform: translateX(-10px); }
                    75% { transform: translateX(10px); }
                }
            `;
            document.head.appendChild(styleShake);

            console.log(`🔑 Правильный код: ${SECRET_CODE}`);
        })();
    </script>
</body>
</html>
