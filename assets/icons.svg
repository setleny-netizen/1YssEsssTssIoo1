<?xml version="1.0" encoding="UTF-8"?>
<!--
  Лохматый клуб — SVG-спрайт иконок UI.
  Стиль: line-art, stroke-width 1.8, currentColor.
  Использование: <svg class="icon"><use href="assets/icons.svg#i-nav-invest"/></svg>
  Цвет наследуется от родителя через currentColor.
  viewBox у всех symbol — 0 0 24 24 (кроме аватара, там 0 0 40 40).
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <!-- ============ BOTTOM NAV ============ -->

  <!-- Инвестиции: растущий график со стрелкой -->
  <symbol id="i-nav-invest" viewBox="0 0 24 24">
    <path d="M3 17l5-6 4 4 6-8" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 7h3v3" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M3 21h18" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  </symbol>

  <!-- Бизнес: портфель -->
  <symbol id="i-nav-business" viewBox="0 0 24 24">
    <rect x="3" y="7" width="18" height="13" rx="2"
          fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"
          fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round"/>
    <path d="M3 12h18" fill="none" stroke="currentColor"
          stroke-width="1.8" opacity="0.5"/>
    <circle cx="12" cy="14" r="1.2" fill="currentColor"/>
  </symbol>

  <!-- Заработок: монета с символом $ -->
  <symbol id="i-nav-earn" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"
            fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M12 7v10" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round"/>
    <path d="M14.5 9.5c0-1-1.1-1.5-2.5-1.5s-2.5.5-2.5 1.5
             1.1 1.5 2.5 1.5 2.5.5 2.5 1.5
             -1.1 1.5-2.5 1.5-2.5-.5-2.5-1.5"
          fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Берлога: гора со снежной шапкой -->
  <symbol id="i-nav-berloga" viewBox="0 0 24 24">
    <path d="M2 20l7-12 4 6 3-4 6 10H2z"
          fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linejoin="round"/>
    <path d="M9 8l3 4 2-2 3 4"
          fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"
          opacity="0.7"/>
  </symbol>

  <!-- Профиль: аватар (силуэт) -->
  <symbol id="i-nav-profile" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="3.5"
            fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M4.5 20c1-3.5 4-5.5 7.5-5.5s6.5 2 7.5 5.5"
          fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round"/>
  </symbol>

  <!-- ============ TOP PANEL ============ -->

  <!-- Аватар игрока: голова Йети (из прототипа 1) -->
  <symbol id="i-avatar-yeti" viewBox="0 0 40 40">
    <path fill="currentColor" d="
      M20 6
      c-6 0 -10 4 -10 10
      c0 2 0.5 3.5 1.5 5
      c-1.5 1 -2.5 2.5 -3 4
      c-0.5 1.5 0 2.5 1 2.5
      c0.7 0 1.2 -0.4 1.6 -1
      c0.6 1.5 1.8 2.6 3.4 3
      c1 2 3 3.5 5.5 3.5
      s4.5 -1.5 5.5 -3.5
      c1.6 -0.4 2.8 -1.5 3.4 -3
      c0.4 0.6 0.9 1 1.6 1
      c1 0 1.5 -1 1 -2.5
      c-0.5 -1.5 -1.5 -3 -3 -4
      c1 -1.5 1.5 -3 1.5 -5
      c0 -6 -4 -10 -10 -10
      z"/>
    <circle cx="16" cy="17" r="1.6" fill="#0A0A0A"/>
    <circle cx="24" cy="17" r="1.6" fill="#0A0A0A"/>
  </symbol>

  <!-- Баланс: монета-«кристалл» (из прототипа 1) -->
  <symbol id="i-balance-coin" viewBox="0 0 24 24">
    <path d="M3 8l9-5 9 5-9 5-9-5z"
          fill="currentColor" fill-opacity="0.25"
          stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M3 8v8l9 5 9-5V8"
          fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linejoin="round"/>
    <path d="M3 8l9 5 9-5"
          fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linejoin="round"/>
    <path d="M12 13v8"
          fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round"/>
  </symbol>

</svg>
