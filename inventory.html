<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Инвентарь — Лохматый клуб</title>
    <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
    <div id="app">
        <!-- TOP PANEL -->
        <header id="top-panel">
            <div class="top-row">
                <div class="player-info">
                    <div class="avatar">
                        <div class="avatar-inner">
                            <svg class="icon icon--avatar" viewBox="0 0 40 40" aria-hidden="true"><use href="assets/icons.svg#i-avatar-yeti"></use></svg>
                        </div>
                    </div>
                    <div class="player-name-level">
                        <div class="player-name" id="player-name">Игрок</div>
                        <div class="player-level" id="player-level">Уровень 1</div>
                    </div>
                </div>
                <div class="balance-badge-group">
                    <div class="balance-badge">
                        <svg class="icon icon--top wallet-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-balance-coin"></use></svg>
                        <span class="balance-value" id="balance-value">0</span>
                    </div>
                </div>
            </div>
            <div class="xp-row">
                <span class="xp-label">XP</span>
                <div class="xp-bar">
                    <div class="xp-bar-fill" id="xp-fill"></div>
                </div>
                <span class="xp-text" id="xp-text">0 / 100</span>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <main id="content">
            <div id="screen-inventory" class="screen-content inventory-screen">
                <div class="inv-topbar">
                    <div class="inv-title">Инвентарь</div>
                </div>
                <div class="inv-grid" id="inv-grid"></div>
            </div>
        </main>

        <!-- BOTTOM NAV -->
        <nav id="bottom-nav">
            <button class="nav-item" data-screen="invest" aria-label="Инвестиции">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-invest"></use></svg>
                <span class="nav-label">Инвест</span>
            </button>
            <button class="nav-item" data-screen="business" aria-label="Бизнес">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-business"></use></svg>
                <span class="nav-label">Бизнес</span>
            </button>
            <button class="nav-item" data-screen="earn" aria-label="Заработок">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-earn"></use></svg>
                <span class="nav-label">Заработок</span>
            </button>
            <button class="nav-item active" data-screen="berloga" aria-label="Берлога">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-berloga"></use></svg>
                <span class="nav-label">Берлога</span>
            </button>
            <button class="nav-item" data-screen="profile" aria-label="Профиль">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-profile"></use></svg>
                <span class="nav-label">Профиль</span>
            </button>
        </nav>
    </div>

    <script>
        (function() {
            const PLAYER_KEY = 'lokhmaty_player_v1';
            const INV_KEY = 'lokhmaty_inventory_v1';

            // Предметы: id → { иконка (SVG symbol), имя, цвет акцента }
            const ITEMS = {
                stone:    { icon: 'i-stone',    name: 'Камень',  color: '#C0C0C0' },
                coal:     { icon: 'i-coal',     name: 'Уголь',   color: '#A0A0A0' },
                iron_ore: { icon: 'i-iron',     name: 'Железо',  color: '#A8B0B8' },
                gold_ore: { icon: 'i-gold-bar', name: 'Золото',  color: '#FFD56B' },
                leaf:     { icon: 'i-leaf',     name: 'Лист',    color: '#7DDFA0' },
            };

            function itemIcon(id, size) {
                size = size || 'icon--hero';
                const iconId = ITEMS[id] ? ITEMS[id].icon : 'i-briefcase';
                return '<svg class="icon ' + size + '" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#' + iconId + '"></use></svg>';
            }

            const player = { wallet: 0, ice: 0, totalXp: 0 };
            const inventory = {};

            const balanceValue = document.getElementById('balance-value');
            const xpFill = document.getElementById('xp-fill');
            const xpText = document.getElementById('xp-text');
            const playerLevelEl = document.getElementById('player-level');
            const invGrid = document.getElementById('inv-grid');

            const navItems = document.querySelectorAll('.nav-item');

            function cumulativeXp(level) {
                let total = 0;
                for (let i = 1; i < level; i++) total += i * 100;
                return total;
            }
            function getLevelInfo(totalXp) {
                let level = 1;
                while (cumulativeXp(level + 1) <= totalXp) level++;
                const base = cumulativeXp(level);
                const next = cumulativeXp(level + 1);
                return { level, currentInLevel: totalXp - base, needForLevel: next - base };
            }

            function formatNumber(num) {
                num = Math.floor(num);
                return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            }

            function loadAll() {
                try {
                    const rawP = localStorage.getItem(PLAYER_KEY);
                    if (rawP) {
                        const p = JSON.parse(rawP);
                        if (typeof p.wallet === 'number') player.wallet = p.wallet;
                        if (typeof p.ice === 'number') player.ice = p.ice;
                        if (typeof p.totalXp === 'number') player.totalXp = p.totalXp;
                    }
                    const rawI = localStorage.getItem(INV_KEY);
                    if (rawI) {
                        const inv = JSON.parse(rawI);
                        for (const id in ITEMS) {
                            inventory[id] = (typeof inv[id] === 'number') ? inv[id] : 0;
                        }
                    } else {
                        for (const id in ITEMS) inventory[id] = 0;
                    }
                } catch (e) {
                    for (const id in ITEMS) inventory[id] = 0;
                }
            }

            function renderTop() {
                balanceValue.textContent = formatNumber(player.wallet);
                const info = getLevelInfo(player.totalXp);
                const percent = Math.min((info.currentInLevel / info.needForLevel) * 100, 100);
                xpFill.style.width = percent + '%';
                xpText.textContent = formatNumber(info.currentInLevel) + ' / ' + formatNumber(info.needForLevel);
                playerLevelEl.textContent = 'Уровень ' + info.level;
            }

            function renderInventory() {
                invGrid.innerHTML = '';

                const owned = [];
                for (const id in ITEMS) {
                    if ((inventory[id] || 0) > 0) {
                        owned.push({ id, cfg: ITEMS[id], count: inventory[id] });
                    }
                }

                if (owned.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'inv-empty';
                    empty.innerHTML =
                        '<div class="inv-empty-emoji">' +
                            '<svg class="icon icon--hero" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-backpack"></use></svg>' +
                        '</div>' +
                        '<div>Инвентарь пуст</div>' +
                        '<div class="inv-empty-hint">Добывай ресурсы в шахте или собирай листья в саду</div>';
                    invGrid.appendChild(empty);
                    return;
                }

                owned.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'inv-item';
                    el.style.setProperty('--item-color', item.cfg.color);
                    el.innerHTML =
                        '<div class="inv-item-icon" style="color:' + item.cfg.color + '">' + itemIcon(item.id, 'icon--hero') + '</div>' +
                        '<div class="inv-item-name">' + item.cfg.name + '</div>' +
                        '<div class="inv-item-count">x' + formatNumber(item.count) + '</div>';
                    invGrid.appendChild(el);
                });
            }

            navItems.forEach(item => {
                const go = function(e) {
                    e.preventDefault();
                    const screen = this.dataset.screen;

                    if (screen === 'business') { window.location.href = 'business.html'; return; }
                    if (screen === 'berloga')  { window.location.href = 'index.html#berloga'; return; }
                    if (screen === 'earn')     { window.location.href = 'index.html#earn';    return; }
                    if (screen === 'invest')   { window.location.href = 'index.html#invest';  return; }
                    if (screen === 'profile')  { window.location.href = 'index.html#profile'; return; }
                };
                item.addEventListener('click', go);
                item.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    go.call(this, e);
                }, { passive: false });
            });

            function init() {
                loadAll();
                renderTop();
                renderInventory();
            }
            init();

            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                    loadAll();
                    renderTop();
                    renderInventory();
                }
            });

            window.addEventListener('focus', function() {
                loadAll();
                renderTop();
                renderInventory();
            });
        })();
    </script>
</body>
</html>
