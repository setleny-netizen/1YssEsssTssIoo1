<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ледогенератор — Лохматый клуб</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div id="app">
        <!-- TOP PANEL -->
        <header id="top-panel">
            <div class="top-row">
                <div class="player-info">
                    <div class="avatar">
                        <div class="avatar-inner">🐻</div>
                    </div>
                    <div class="player-name-level">
                        <div class="player-name" id="player-name">Игрок</div>
                        <div class="player-level" id="player-level">Уровень 1</div>
                    </div>
                </div>
                <div class="balance-badge-group">
                    <div class="balance-badge">
                        <span class="wallet-icon">💵</span>
                        <span class="balance-value" id="balance-value">0</span>
                    </div>
                    <div class="balance-badge ice">
                        <span class="wallet-icon">🧊</span>
                        <span class="balance-value" id="ice-value">0</span>
                    </div>
                </div>
            </div>
            <div class="xp-row">
                <span class="xp-label">XP</span>
                <div class="xp-bar">
                    <div class="xp-bar-fill" id="xp-fill"></div>
                </div>
                <span class="xp-text" id="xp-text">0 / 100</span>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <main id="content">
            <div id="screen-ice" class="screen-content">

                <div class="ice-hero">
                    <div class="ice-image-wrap">
                        <div class="ice-glow"></div>
                        <img src="https://cdn.pixabay.com/photo/2026/09/10/15/30/15-30-22-199_1280.png" alt="Ледогенератор" draggable="false" loading="eager">
                    </div>
                    <div class="ice-hero-info">
                        <div class="ice-hero-title" id="ice-level-title">ЛЕДОГЕНЕРАТОР I</div>
                        <div class="ice-hero-status" id="ice-status">
                            <span class="ice-status-dot"></span>
                            <span class="ice-status-text">РАБОТАЕТ</span>
                        </div>
                    </div>
                </div>

                <div class="ice-info-row">
                    <div class="ice-info-cell">
                        <div class="ice-info-label">Производство</div>
                        <div class="ice-info-value" id="ice-production">+5 🧊 / час</div>
                    </div>
                    <div class="ice-info-cell">
                        <div class="ice-info-label">Следующий лёд</div>
                        <div class="ice-info-value" id="ice-next-timer">--:--</div>
                    </div>
                </div>

                <div class="ice-storage-card">
                    <div class="ice-storage-header">
                        <span class="ice-storage-emoji">🧊</span>
                        <span class="ice-storage-title">НАКОПЛЕНО</span>
                    </div>
                    <div class="ice-storage-count">
                        <span id="ice-stored">0</span>
                        <span class="ice-storage-sep">/</span>
                        <span id="ice-capacity">500</span>
                    </div>
                    <div class="ice-storage-bar">
                        <div class="ice-storage-bar-fill" id="ice-storage-fill"></div>
                    </div>
                </div>

                <button class="ice-collect-btn" id="ice-collect-btn" disabled>
                    <span class="ice-collect-emoji">🧊</span>
                    <span class="ice-collect-text">ЗАБРАТЬ</span>
                    <span class="ice-collect-amount" id="ice-collect-amount">0</span>
                </button>

                <button class="ice-upgrade-btn" id="ice-upgrade-btn">
                    <div class="ice-upgrade-left">
                        <div class="ice-upgrade-title">
                            <span class="ice-upgrade-arrow">⬆️</span>
                            <span>УЛУЧШИТЬ</span>
                        </div>
                        <div class="ice-upgrade-desc" id="ice-upgrade-desc">Ледогенератор II · +10 🧊 / час · 1 000</div>
                    </div>
                    <div class="ice-upgrade-cost" id="ice-upgrade-cost">2 500 💵</div>
                </button>

            </div>
        </main>

        <!-- BOTTOM NAV -->
        <nav id="bottom-nav">
            <button class="nav-item" data-screen="invest" aria-label="Инвестиции">
                <span class="nav-emoji">📈</span>
                <span class="nav-label">Инвест</span>
            </button>
            <button class="nav-item" data-screen="business" aria-label="Бизнес">
                <span class="nav-emoji">💼</span>
                <span class="nav-label">Бизнес</span>
            </button>
            <button class="nav-item" data-screen="earn" aria-label="Заработок">
                <span class="nav-emoji">💵</span>
                <span class="nav-label">Заработок</span>
            </button>
            <button class="nav-item active" data-screen="berloga" aria-label="Берлога">
                <span class="nav-emoji">🏔️</span>
                <span class="nav-label">Берлога</span>
            </button>
            <button class="nav-item" data-screen="profile" aria-label="Профиль">
                <span class="nav-emoji">👤</span>
                <span class="nav-label">Профиль</span>
            </button>
        </nav>
    </div>

    <script>
        (function() {
            const PLAYER_KEY = 'lokhmaty_player_v1';
            const GEN_KEY = 'lokhmaty_ice_gen_v1';

            // ====== КОНФИГ УРОВНЕЙ (10 шт) ======
            const LEVELS = {
                1:  { name: 'ЛЕДОГЕНЕРАТОР I',    productionPerHour: 5,    capacity: 500,    upgradeCost: 2500,     nextLevel: 2 },
                2:  { name: 'ЛЕДОГЕНЕРАТОР II',   productionPerHour: 10,   capacity: 1000,   upgradeCost: 7500,     nextLevel: 3 },
                3:  { name: 'ЛЕДОГЕНЕРАТОР III',  productionPerHour: 20,   capacity: 2000,   upgradeCost: 20000,    nextLevel: 4 },
                4:  { name: 'ЛЕДОГЕНЕРАТОР IV',   productionPerHour: 40,   capacity: 4000,   upgradeCost: 50000,    nextLevel: 5 },
                5:  { name: 'ЛЕДОГЕНЕРАТОР V',    productionPerHour: 80,   capacity: 8000,   upgradeCost: 120000,   nextLevel: 6 },
                6:  { name: 'ЛЕДОГЕНЕРАТОР VI',   productionPerHour: 150,  capacity: 15000,  upgradeCost: 300000,   nextLevel: 7 },
                7:  { name: 'ЛЕДОГЕНЕРАТОР VII',  productionPerHour: 300,  capacity: 30000,  upgradeCost: 750000,   nextLevel: 8 },
                8:  { name: 'ЛЕДОГЕНЕРАТОР VIII', productionPerHour: 600,  capacity: 60000,  upgradeCost: 1800000,  nextLevel: 9 },
                9:  { name: 'ЛЕДОГЕНЕРАТОР IX',   productionPerHour: 1200, capacity: 120000, upgradeCost: 4500000,  nextLevel: 10 },
                10: { name: 'ЛЕДОГЕНЕРАТОР X',    productionPerHour: 2500, capacity: 250000, upgradeCost: null,     nextLevel: null },
            };

            // ====== УРОВНИ ИГРОКА ======
            function cumulativeXp(level) {
                let total = 0;
                for (let i = 1; i < level; i++) total += i * 100;
                return total;
            }

            function getLevelInfo(totalXp) {
                let level = 1;
                while (cumulativeXp(level + 1) <= totalXp) level++;
                const base = cumulativeXp(level);
                const next = cumulativeXp(level + 1);
                return {
                    level,
                    currentInLevel: totalXp - base,
                    needForLevel: next - base,
                };
            }

            // ====== СОСТОЯНИЕ ИГРОКА ======
            const player = {
                wallet: 0,
                ice: 0,
                totalXp: 0,
            };

            // ====== СОСТОЯНИЕ ГЕНЕРАТОРА ======
            const gen = {
                level: 1,
                storedIce: 0,
                lastTick: Date.now(),
            };

            // ====== DOM ======
            const balanceValue = document.getElementById('balance-value');
            const iceValue = document.getElementById('ice-value');
            const xpFill = document.getElementById('xp-fill');
            const xpText = document.getElementById('xp-text');
            const playerLevelEl = document.getElementById('player-level');

            const levelTitle = document.getElementById('ice-level-title');
            const statusEl = document.getElementById('ice-status');
            const productionEl = document.getElementById('ice-production');
            const nextTimerEl = document.getElementById('ice-next-timer');
            const storedEl = document.getElementById('ice-stored');
            const capacityEl = document.getElementById('ice-capacity');
            const storageFill = document.getElementById('ice-storage-fill');
            const collectBtn = document.getElementById('ice-collect-btn');
            const collectAmount = document.getElementById('ice-collect-amount');
            const upgradeBtn = document.getElementById('ice-upgrade-btn');
            const upgradeDesc = document.getElementById('ice-upgrade-desc');
            const upgradeCost = document.getElementById('ice-upgrade-cost');

            const navItems = document.querySelectorAll('.nav-item');

            // ====== ФОРМАТ ======
            function formatNumber(num) {
                num = Math.floor(num);
                if (num >= 1000000000) return (num / 1000000000).toFixed(1) + 'B';
                if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
                if (num >= 1000) return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
                return num.toString();
            }

            function formatTimer(seconds) {
                if (seconds == null || seconds < 0) return '--:--';
                seconds = Math.max(0, Math.floor(seconds));
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                if (h > 0) {
                    return h + 'ч ' + String(m).padStart(2, '0') + 'м';
                }
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }

            // ====== СОХРАНЕНИЕ ======
            function savePlayer() {
                try {
                    const raw = localStorage.getItem(PLAYER_KEY);
                    const existing = raw ? JSON.parse(raw) : {};
                    existing.wallet = player.wallet;
                    existing.ice = player.ice;
                    existing.totalXp = player.totalXp;
                    localStorage.setItem(PLAYER_KEY, JSON.stringify(existing));
                } catch (e) {}
            }

            function loadPlayer() {
                try {
                    const raw = localStorage.getItem(PLAYER_KEY);
                    if (raw) {
                        const p = JSON.parse(raw);
                        if (typeof p.wallet === 'number') player.wallet = p.wallet;
                        if (typeof p.ice === 'number') player.ice = p.ice;
                        if (typeof p.totalXp === 'number') player.totalXp = p.totalXp;
                    }
                } catch (e) {}
            }

            function saveGen() {
                try {
                    localStorage.setItem(GEN_KEY, JSON.stringify({
                        level: gen.level,
                        storedIce: gen.storedIce,
                        lastTick: gen.lastTick,
                    }));
                } catch (e) {}
            }

            function loadGen() {
                try {
                    const raw = localStorage.getItem(GEN_KEY);
                    if (raw) {
                        const p = JSON.parse(raw);
                        if (typeof p.level === 'number' && LEVELS[p.level]) gen.level = p.level;
                        if (typeof p.storedIce === 'number') gen.storedIce = p.storedIce;
                        if (typeof p.lastTick === 'number') gen.lastTick = p.lastTick;
                    }
                } catch (e) {}
            }

            // ====== AFK-ЛОГИКА ======
            function getConfig() {
                return LEVELS[gen.level];
            }

            function secondsPerIce() {
                return 3600 / getConfig().productionPerHour;
            }

            function recalculate() {
                const now = Date.now();
                const cfg = getConfig();
                const sp = secondsPerIce();
                const elapsedSec = (now - gen.lastTick) / 1000;
                const spaceLeft = cfg.capacity - gen.storedIce;

                if (spaceLeft <= 0) {
                    gen.lastTick = now;
                    return;
                }

                const canProduce = Math.floor(elapsedSec / sp);
                if (canProduce <= 0) return;

                const add = Math.min(canProduce, spaceLeft);
                gen.storedIce += add;
                gen.lastTick += add * sp * 1000;

                if (gen.storedIce >= cfg.capacity) {
                    gen.lastTick = now;
                }

                saveGen();
            }

            // ====== ОТРИСОВКА ======
            function renderTop() {
                balanceValue.textContent = formatNumber(player.wallet);
                iceValue.textContent = formatNumber(player.ice);

                const info = getLevelInfo(player.totalXp);
                const percent = Math.min((info.currentInLevel / info.needForLevel) * 100, 100);
                xpFill.style.width = percent + '%';
                xpText.textContent = formatNumber(info.currentInLevel) + ' / ' + formatNumber(info.needForLevel);
                playerLevelEl.textContent = 'Уровень ' + info.level;
            }

            function renderGenerator() {
                const cfg = getConfig();

                levelTitle.textContent = cfg.name;
                productionEl.textContent = '+' + formatNumber(cfg.productionPerHour) + ' 🧊 / час';
                capacityEl.textContent = formatNumber(cfg.capacity);
                storedEl.textContent = formatNumber(gen.storedIce);

                const isFull = gen.storedIce >= cfg.capacity;
                statusEl.classList.toggle('full', isFull);
                statusEl.querySelector('.ice-status-text').textContent =
                    isFull ? 'ХРАНИЛИЩЕ ЗАПОЛНЕНО' : 'РАБОТАЕТ';

                const percent = Math.min((gen.storedIce / cfg.capacity) * 100, 100);
                storageFill.style.width = percent + '%';
                storageFill.classList.toggle('full', isFull);

                const canCollect = gen.storedIce > 0;
                collectBtn.disabled = !canCollect;
                collectBtn.classList.toggle('disabled', !canCollect);
                collectAmount.textContent = formatNumber(gen.storedIce);

                if (cfg.nextLevel) {
                    const next = LEVELS[cfg.nextLevel];
                    upgradeDesc.textContent =
                        next.name + ' · +' + formatNumber(next.productionPerHour) + ' 🧊 / час · ' +
                        formatNumber(next.capacity);
                    upgradeCost.textContent = formatNumber(cfg.upgradeCost) + ' 💵';
                    upgradeBtn.disabled = false;
                    upgradeBtn.style.display = '';
                } else {
                    upgradeBtn.disabled = true;
                    upgradeBtn.style.display = 'none';
                }
            }

            function renderNextTimer() {
                const cfg = getConfig();
                if (gen.storedIce >= cfg.capacity) {
                    nextTimerEl.textContent = '--:--';
                    return;
                }
                const sp = secondsPerIce();
                const elapsed = (Date.now() - gen.lastTick) / 1000;
                const nextIn = sp - (elapsed % sp);
                nextTimerEl.textContent = formatTimer(nextIn);
            }

            // ====== ДЕЙСТВИЯ ======
            function collect() {
                if (gen.storedIce <= 0) return;
                const amount = gen.storedIce;
                gen.storedIce = 0;
                player.ice += amount;
                gen.lastTick = Date.now();

                spawnFloatText('+' + formatNumber(amount) + ' 🧊', collectBtn);

                const iceBadge = iceValue.closest('.balance-badge');
                if (iceBadge) {
                    iceBadge.classList.add('bump');
                    setTimeout(() => iceBadge.classList.remove('bump'), 300);
                }

                savePlayer();
                saveGen();
                renderTop();
                renderGenerator();
            }

            function upgrade() {
                const cfg = getConfig();
                if (!cfg.nextLevel) return;
                if (player.wallet < cfg.upgradeCost) {
                    upgradeBtn.classList.add('shake');
                    setTimeout(() => upgradeBtn.classList.remove('shake'), 400);
                    return;
                }
                player.wallet -= cfg.upgradeCost;
                gen.level = cfg.nextLevel;
                savePlayer();
                saveGen();
                renderTop();
                renderGenerator();
            }

            function spawnFloatText(text, anchor) {
                const rect = anchor.getBoundingClientRect();
                const el = document.createElement('div');
                el.className = 'ice-float';
                el.textContent = text;
                el.style.left = (rect.left + rect.width / 2) + 'px';
                el.style.top = (rect.top + 10) + 'px';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1100);
            }

            // ====== НАВИГАЦИЯ ======
            navItems.forEach(item => {
                const go = function(e) {
                    e.preventDefault();
                    recalculate();
                    saveGen();
                    savePlayer();
                    if (this.dataset.screen === 'earn') {
                        window.location.href = 'index.html#earn';
                    } else if (this.dataset.screen === 'berloga') {
                        window.location.href = 'index.html';
                    } else {
                        window.location.href = 'index.html#' + this.dataset.screen;
                    }
                };
                item.addEventListener('click', go);
                item.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    go.call(this, e);
                }, { passive: false });
            });

            // ====== ОБРАБОТЧИКИ ======
            collectBtn.addEventListener('click', collect);
            collectBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                collect();
            }, { passive: false });

            upgradeBtn.addEventListener('click', upgrade);
            upgradeBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                upgrade();
            }, { passive: false });

            // ====== ИНИЦИАЛИЗАЦИЯ ======
            loadPlayer();
            loadGen();
            recalculate();
            renderTop();
            renderGenerator();
            renderNextTimer();

            // ====== ТАЙМЕРЫ ======
            setInterval(function() {
                recalculate();
                renderGenerator();
            }, 5000);

            setInterval(function() {
                renderNextTimer();
                recalculate();
                const stored = Math.floor(gen.storedIce);
                if (stored !== parseInt(storedEl.textContent.replace(/\s/g, ''), 10)) {
                    renderGenerator();
                }
            }, 1000);

            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'hidden') {
                    recalculate();
                    saveGen();
                    savePlayer();
                } else {
                    loadPlayer();
                    loadGen();
                    recalculate();
                    renderTop();
                    renderGenerator();
                }
            });

            window.addEventListener('beforeunload', function() {
                recalculate();
                saveGen();
                savePlayer();
            });

            // ====== SAFE AREA ======
            function handleSafeArea() {
                const bottomNav = document.getElementById('bottom-nav');
                const safeBottom = getComputedStyle(document.documentElement)
                    .getPropertyValue('env(safe-area-inset-bottom)');
                if (safeBottom && safeBottom !== '0px') {
                    bottomNav.style.paddingBottom = safeBottom;
                }
            }
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', handleSafeArea);
            }
            handleSafeArea();

            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });
        })();
    </script>
</body>
</html>
