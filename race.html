<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Быстрый заезд — Лохматый клуб</title>
    <link rel="stylesheet" href="style.css?v=18">
</head>
<body>
    <div id="app">
        <!-- TOP PANEL -->
        <header id="top-panel">
            <div class="top-row">
                <div class="player-info">
                    <div class="avatar">
                        <div class="avatar-inner">
                            <svg class="icon icon--avatar" viewBox="0 0 40 40" aria-hidden="true"><use href="assets/icons.svg#i-avatar-yeti"></use></svg>
                        </div>
                    </div>
                    <div class="player-name-level">
                        <div class="player-name" id="player-name">Игрок</div>
                        <div class="player-level" id="player-level">Уровень 1</div>
                    </div>
                </div>
                <div class="balance-badge-group">
                    <div class="balance-badge">
                        <svg class="icon icon--top wallet-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-balance-coin"></use></svg>
                        <span class="balance-value" id="balance-value">0</span>
                    </div>
                </div>
            </div>
            <div class="xp-row">
                <span class="xp-label">XP</span>
                <div class="xp-bar">
                    <div class="xp-bar-fill" id="xp-fill"></div>
                </div>
                <span class="xp-text" id="xp-text">0 / 100</span>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <main id="content">
            <div id="screen-race" class="screen-content">

                <!-- TOPBAR -->
                <div class="race-topbar">
                    <div class="race-title">Быстрый заезд</div>
                    <div class="race-ice-badge">
                        <svg class="icon icon--top race-ice-emoji" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-ice-cube"></use></svg>
                        <span class="race-ice-value" id="race-ice-value">0</span>
                    </div>
                </div>

                <!-- RACER CARDS -->
                <div class="race-racers">
                    <div class="racer-card racer-me">
                        <div class="racer-avatar racer-avatar-me">
                            <svg class="icon icon--avatar" viewBox="0 0 40 40" aria-hidden="true"><use href="assets/icons.svg#i-avatar-yeti"></use></svg>
                        </div>
                        <div class="racer-info">
                            <div class="racer-title">Я</div>
                            <div class="racer-speed"><span id="my-speed">80</span> км/ч</div>
                        </div>
                    </div>

                    <div class="racer-vs">VS</div>

                    <div class="racer-card racer-npc">
                        <div class="racer-info racer-info-right">
                            <div class="racer-title">НПС</div>
                            <div class="racer-speed"><span id="npc-speed">??</span> км/ч</div>
                        </div>
                        <div class="racer-avatar racer-avatar-npc">
                            <svg class="icon icon--avatar" viewBox="0 0 40 40" aria-hidden="true"><use href="assets/icons.svg#i-fox"></use></svg>
                        </div>
                    </div>
                </div>

                <!-- TRACK -->
                <div class="race-track" id="race-track">

                    <div class="race-scene">
                        <div class="race-sky"></div>
                        <div class="race-mountains"></div>
                        <div class="race-trees-layer"></div>
                        <div class="race-ground"></div>
                    </div>

                    <div class="race-lanes" id="race-lanes">
                        <div class="race-lane race-lane-npc">
                            <div class="race-lane-dash"></div>
                        </div>
                        <div class="race-lane race-lane-me">
                            <div class="race-lane-dash"></div>
                        </div>
                    </div>

                    <div class="race-start-line" id="race-start-line"></div>
                    <div class="race-finish-line" id="race-finish-line"></div>

                    <div class="race-runner race-runner-npc" id="runner-npc">
                        <div class="sled sled-red">
                            <div class="sled-body"></div>
                            <div class="sled-back"></div>
                            <div class="sled-front"></div>
                            <div class="sled-runner-left"></div>
                            <div class="sled-runner-right"></div>
                        </div>
                    </div>

                    <div class="race-runner race-runner-me" id="runner-me">
                        <div class="sled sled-blue">
                            <div class="sled-body"></div>
                            <div class="sled-back"></div>
                            <div class="sled-front"></div>
                            <div class="sled-runner-left"></div>
                            <div class="sled-runner-right"></div>
                        </div>
                    </div>

                    <div class="race-snow" id="race-snow"></div>

                    <!-- СВЕТОФОР F1 -->
                    <div class="race-traffic" id="race-traffic" style="display:none">
                        <div class="traffic-light" id="tl1"></div>
                        <div class="traffic-light" id="tl2"></div>
                        <div class="traffic-light" id="tl3"></div>
                        <div class="traffic-light" id="tl4"></div>
                        <div class="traffic-light" id="tl5"></div>
                    </div>

                </div>

                <!-- START BUTTON -->
                <button class="race-start-btn" id="race-start-btn">
                    <svg class="icon icon--top race-start-emoji" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-race-flag"></use></svg>
                    <span class="race-start-text" id="race-start-text">СТАРТ</span>
                    <span class="race-start-cost" id="race-start-cost">
                        <svg class="icon icon--top" viewBox="0 0 24 24" aria-hidden="true" style="margin-right:3px"><use href="assets/icons.svg#i-ice-cube"></use></svg>
                        1
                    </span>
                </button>

                <!-- RESULT -->
                <div class="race-result hidden" id="race-result"></div>

            </div>
        </main>

        <!-- BOTTOM NAV -->
        <nav id="bottom-nav">
            <button class="nav-item" data-screen="invest" aria-label="Инвестиции">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-invest"></use></svg>
                <span class="nav-label">Инвест</span>
            </button>
            <button class="nav-item" data-screen="business" aria-label="Бизнес">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-business"></use></svg>
                <span class="nav-label">Бизнес</span>
            </button>
            <button class="nav-item active" data-screen="earn" aria-label="Заработок">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-earn"></use></svg>
                <span class="nav-label">Заработок</span>
            </button>
            <button class="nav-item" data-screen="berloga" aria-label="Берлога">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-berloga"></use></svg>
                <span class="nav-label">Берлога</span>
            </button>
            <button class="nav-item" data-screen="profile" aria-label="Профиль">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-profile"></use></svg>
                <span class="nav-label">Профиль</span>
            </button>
        </nav>
    </div>

    <script>
        (function() {
            const PLAYER_KEY = 'lokhmaty_player_v1';

            const MY_SPEED = 80;
            const RACE_DURATION = 5000;
            const WIN_CHANCE = 0.78;
            const REWARD_WIN_WALLET = 100;
            const REWARD_WIN_XP = 3;
            const REWARD_LOSE_XP = 1;
            const RACE_COST_ICE = 1;

            const LIGHT_STEP_MS = 300;
            const LIGHT_HOLD_MS = 1000;
            const LIGHT_FADEOUT_MS = 400;

            const START_X = 14;
            const END_X = 88;
            const START_LINE_START = 4;
            const START_LINE_END = -30;
            const FINISH_LINE_START = 120;
            const FINISH_LINE_END = 88;

            // SVG-хелпер
            function icon(id, size) {
                size = size || 'icon--top';
                return '<svg class="icon ' + size + '" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#' + id + '"></use></svg>';
            }

            function cumulativeXp(level) {
                let total = 0;
                for (let i = 1; i < level; i++) total += i * 100;
                return total;
            }

            function getLevelInfo(totalXp) {
                let level = 1;
                while (cumulativeXp(level + 1) <= totalXp) level++;
                const base = cumulativeXp(level);
                const next = cumulativeXp(level + 1);
                return {
                    level,
                    currentInLevel: totalXp - base,
                    needForLevel: next - base,
                };
            }

            const state = { wallet: 0, ice: 0, totalXp: 0, racing: false };

            const balanceValue = document.getElementById('balance-value');
            const xpFill = document.getElementById('xp-fill');
            const xpText = document.getElementById('xp-text');
            const playerLevelEl = document.getElementById('player-level');
            const raceIceValue = document.getElementById('race-ice-value');

            const mySpeedEl = document.getElementById('my-speed');
            const npcSpeedEl = document.getElementById('npc-speed');

            const runnerMe = document.getElementById('runner-me');
            const runnerNpc = document.getElementById('runner-npc');

            const startLine = document.getElementById('race-start-line');
            const finishLine = document.getElementById('race-finish-line');

            const raceLanes = document.getElementById('race-lanes');

            const startBtn = document.getElementById('race-start-btn');
            const startText = document.getElementById('race-start-text');
            const startCost = document.getElementById('race-start-cost');
            const resultEl = document.getElementById('race-result');

            const trafficEl = document.getElementById('race-traffic');
            const tl1 = document.getElementById('tl1');
            const tl2 = document.getElementById('tl2');
            const tl3 = document.getElementById('tl3');
            const tl4 = document.getElementById('tl4');
            const tl5 = document.getElementById('tl5');
            const trafficLights = [tl1, tl2, tl3, tl4, tl5];

            const snowLayer = document.getElementById('race-snow');
            const navItems = document.querySelectorAll('.nav-item');

            // ====== СНЕЖИНКИ ======
            function createSnow() {
                snowLayer.innerHTML = '';
                const count = 18;
                for (let i = 0; i < count; i++) {
                    const flake = document.createElement('span');
                    flake.className = 'snowflake';
                    flake.style.left = (Math.random() * 100) + '%';
                    flake.style.animationDelay = (Math.random() * 6) + 's';
                    flake.style.animationDuration = (4 + Math.random() * 4) + 's';
                    flake.style.opacity = (0.4 + Math.random() * 0.6).toString();
                    flake.style.transform = 'scale(' + (0.5 + Math.random() * 0.7) + ')';
                    snowLayer.appendChild(flake);
                }
            }
            createSnow();

            function formatNumber(num) {
                num = Math.floor(num);
                return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            }

            function savePlayer() {
                try {
                    const raw = localStorage.getItem(PLAYER_KEY);
                    const existing = raw ? JSON.parse(raw) : {};
                    existing.wallet = state.wallet;
                    existing.ice = state.ice;
                    existing.totalXp = state.totalXp;
                    localStorage.setItem(PLAYER_KEY, JSON.stringify(existing));
                } catch (e) {}
            }

            function loadPlayer() {
                try {
                    const raw = localStorage.getItem(PLAYER_KEY);
                    if (raw) {
                        const p = JSON.parse(raw);
                        if (typeof p.wallet === 'number') state.wallet = p.wallet;
                        if (typeof p.ice === 'number') state.ice = p.ice;
                        if (typeof p.totalXp === 'number') state.totalXp = p.totalXp;
                    } else {
                        state.wallet = 0;
                        state.ice = 0;
                        state.totalXp = 0;
                        savePlayer();
                    }
                } catch (e) {}
            }

            function renderTop() {
                balanceValue.textContent = formatNumber(state.wallet);
                if (raceIceValue) raceIceValue.textContent = formatNumber(state.ice);

                const info = getLevelInfo(state.totalXp);
                const percent = Math.min((info.currentInLevel / info.needForLevel) * 100, 100);
                xpFill.style.width = percent + '%';
                xpText.textContent = formatNumber(info.currentInLevel) + ' / ' + formatNumber(info.needForLevel);
                playerLevelEl.textContent = 'Уровень ' + info.level;
            }

            function updateStartButton() {
                if (state.racing) return;
                const hasIce = state.ice >= RACE_COST_ICE;
                startText.textContent = hasIce ? 'СТАРТ' : 'НУЖЕН ЛЁД';
                startBtn.disabled = !hasIce;
                startCost.innerHTML = icon('i-ice-cube', 'icon--top') + ' ' + RACE_COST_ICE;
            }

            function resetPositions() {
                runnerMe.style.transition = 'none';
                runnerNpc.style.transition = 'none';
                runnerMe.style.left = START_X + '%';
                runnerNpc.style.left = START_X + '%';

                startLine.style.transition = 'none';
                startLine.style.left = START_LINE_START + '%';

                finishLine.style.transition = 'none';
                finishLine.style.left = FINISH_LINE_START + '%';

                void runnerMe.offsetWidth;
                void runnerNpc.offsetWidth;
                void startLine.offsetWidth;
                void finishLine.offsetWidth;

                runnerMe.style.transition = '';
                runnerNpc.style.transition = '';
                startLine.style.transition = '';
                finishLine.style.transition = '';
            }

            function runTrafficLight() {
                return new Promise(resolve => {
                    trafficEl.style.display = 'flex';

                    trafficLights.forEach(l => {
                        l.style.background = '#1A1A1A';
                        l.style.borderColor = '#2A2A2A';
                        l.style.boxShadow = 'inset 0 2px 4px rgba(0,0,0,0.8)';
                    });

                    for (let i = 0; i < 5; i++) {
                        setTimeout(() => {
                            trafficLights[i].style.background = 'radial-gradient(circle at 35% 35%, #FF5050, #C00000)';
                            trafficLights[i].style.borderColor = '#FF5050';
                            trafficLights[i].style.boxShadow = '0 0 18px rgba(255, 60, 60, 0.95), inset 0 -2px 4px rgba(0,0,0,0.4)';
                        }, LIGHT_STEP_MS * (i + 1));
                    }

                    const totalOn = LIGHT_STEP_MS * 5 + LIGHT_HOLD_MS;

                    setTimeout(() => {
                        trafficLights.forEach(l => {
                            l.style.background = '#1A1A1A';
                            l.style.borderColor = '#2A2A2A';
                            l.style.boxShadow = 'inset 0 2px 4px rgba(0,0,0,0.8)';
                        });

                        setTimeout(() => {
                            trafficEl.style.display = 'none';
                            resolve();
                        }, LIGHT_FADEOUT_MS);

                    }, totalOn);
                });
            }

            function startRace() {
                if (state.racing) return;

                if (state.ice < RACE_COST_ICE) {
                    startBtn.classList.add('shake');
                    setTimeout(() => startBtn.classList.remove('shake'), 400);
                    return;
                }

                state.ice -= RACE_COST_ICE;
                savePlayer();
                renderTop();

                state.racing = true;

                resultEl.classList.add('hidden');
                resultEl.classList.remove('win', 'lose');

                resetPositions();

                startBtn.disabled = true;
                startText.textContent = 'ПОДГОТОВКА...';
                startCost.innerHTML = '';

                const playerWins = Math.random() < WIN_CHANCE;

                let npcSpeed;
                if (playerWins) {
                    npcSpeed = 60 + Math.floor(Math.random() * 20);
                } else {
                    npcSpeed = 81 + Math.floor(Math.random() * 20);
                }

                runTrafficLight().then(() => {
                    startText.textContent = 'В ГОНКЕ...';

                    raceLanes.classList.add('racing');

                    npcSpeedEl.textContent = npcSpeed;

                    const maxSpeed = Math.max(MY_SPEED, npcSpeed);
                    const myFinalProgress = MY_SPEED / maxSpeed;
                    const npcFinalProgress = npcSpeed / maxSpeed;

                    const range = END_X - START_X;
                    const startLineRange = START_LINE_START - START_LINE_END;
                    const finishLineRange = FINISH_LINE_START - FINISH_LINE_END;
                    const startTime = performance.now();

                    function tick(now) {
                        const elapsed = now - startTime;
                        const t = Math.min(elapsed / RACE_DURATION, 1);

                        const myLeft = START_X + (t * myFinalProgress) * range;
                        const npcLeft = START_X + (t * npcFinalProgress) * range;

                        runnerMe.style.left = myLeft + '%';
                        runnerNpc.style.left = npcLeft + '%';

                        const startLineLeft = START_LINE_START - t * startLineRange;
                        startLine.style.left = startLineLeft + '%';

                        const finishLeft = FINISH_LINE_START - t * finishLineRange;
                        finishLine.style.left = finishLeft + '%';

                        if (t < 1) {
                            requestAnimationFrame(tick);
                        } else {
                            raceLanes.classList.remove('racing');
                            finishRace(playerWins);
                        }
                    }
                    requestAnimationFrame(tick);
                });
            }

            function finishRace(playerWins) {
                let message;

                if (playerWins) {
                    state.wallet += REWARD_WIN_WALLET;
                    state.totalXp += REWARD_WIN_XP;
                    message = icon('i-balance-coin', 'icon--top') + ' ПОБЕДА! +' + REWARD_WIN_WALLET + ' · +' + REWARD_WIN_XP + ' XP';
                    resultEl.classList.add('win');
                } else {
                    state.totalXp += REWARD_LOSE_XP;
                    message = icon('i-frost', 'icon--top') + ' Проигрыш... +' + REWARD_LOSE_XP + ' XP';
                    resultEl.classList.add('lose');
                }

                resultEl.innerHTML = message;
                resultEl.classList.remove('hidden');

                savePlayer();
                renderTop();

                state.racing = false;

                const hasIce = state.ice >= RACE_COST_ICE;
                startBtn.disabled = !hasIce;
                startText.textContent = hasIce ? 'ЕЩЁ РАЗ' : 'НУЖЕН ЛЁД';
                startCost.innerHTML = icon('i-ice-cube', 'icon--top') + ' ' + RACE_COST_ICE;
            }

            // ====== НАВИГАЦИЯ ======
            navItems.forEach(item => {
                const go = function(e) {
                    e.preventDefault();
                    if (state.racing) return;

                    const screen = this.dataset.screen;

                    if (screen === 'business') { window.location.href = 'business.html'; return; }
                    if (screen === 'earn')     { window.location.href = 'index.html#earn';    return; }
                    if (screen === 'berloga')  { window.location.href = 'index.html#berloga'; return; }
                    if (screen === 'invest')   { window.location.href = 'index.html#invest';  return; }
                    if (screen === 'profile')  { window.location.href = 'index.html#profile'; return; }
                };
                item.addEventListener('click', go);
                item.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    go.call(this, e);
                }, { passive: false });
            });

            startBtn.addEventListener('click', startRace);
            startBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                startRace();
            }, { passive: false });

            function init() {
                loadPlayer();
                renderTop();
                resetPositions();
                updateStartButton();
            }
            init();

            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                    loadPlayer();
                    renderTop();
                    if (!state.racing) updateStartButton();
                }
            });

            window.addEventListener('focus', function() {
                loadPlayer();
                renderTop();
                if (!state.racing) updateStartButton();
            });
        })();
    </script>
</body>
</html>
