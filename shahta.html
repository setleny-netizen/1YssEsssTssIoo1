<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Шахта — Лохматый клуб</title>
    <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
    <div id="app">
        <!-- TOP PANEL -->
        <header id="top-panel">
            <div class="top-row">
                <div class="player-info">
                    <div class="avatar">
                        <div class="avatar-inner">🐻</div>
                    </div>
                    <div class="player-name-level">
                        <div class="player-name" id="player-name">Игрок</div>
                        <div class="player-level" id="player-level">Уровень 1</div>
                    </div>
                </div>
                <div class="balance-badge-group">
                    <div class="balance-badge">
                        <span class="wallet-icon">💵</span>
                        <span class="balance-value" id="balance-value">0</span>
                    </div>
                </div>
            </div>
            <div class="xp-row">
                <span class="xp-label">XP</span>
                <div class="xp-bar">
                    <div class="xp-bar-fill" id="xp-fill"></div>
                </div>
                <span class="xp-text" id="xp-text">0 / 100</span>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <main id="content">
            <div id="screen-mine" class="screen-content mine-screen">

                <!-- TOPBAR -->
                <div class="mine-topbar">
                    <div class="mine-title">Шахта</div>
                    <div class="mine-ice-badge">
                        <span class="mine-ice-emoji">🧊</span>
                        <span class="mine-ice-value" id="mine-ice-value">0</span>
                    </div>
                </div>

                <!-- BANNER: картинка шахты -->
                <div class="mine-banner">
                    <img src="https://cdn.pixabay.com/photo/2026/09/14/09/18/09-18-29-410_1280.png" alt="Шахта" draggable="false" loading="eager">
                    <div class="mine-banner-overlay">
                        <div class="mine-banner-title">РУДНИК</div>
                        <div class="mine-banner-sub">Выбери жилу для добычи</div>
                    </div>
                </div>

                <!-- VEINS: три жилы -->
                <div class="mine-veins">

                    <button class="mine-vein vein-stone" data-vein="stone">
                        <div class="vein-top">
                            <div class="vein-icon">🪨</div>
                            <div class="vein-name-block">
                                <div class="vein-name">Каменная жила</div>
                                <div class="vein-desc">Камень · Уголь</div>
                            </div>
                        </div>
                        <div class="vein-bottom">
                            <div class="vein-cost">1 🧊</div>
                            <div class="vein-action">КОПАТЬ</div>
                        </div>
                    </button>

                    <button class="mine-vein vein-iron" data-vein="iron">
                        <div class="vein-top">
                            <div class="vein-icon">⚙️</div>
                            <div class="vein-name-block">
                                <div class="vein-name">Железная жила</div>
                                <div class="vein-desc">Железо · Уголь</div>
                            </div>
                        </div>
                        <div class="vein-bottom">
                            <div class="vein-cost">3 🧊</div>
                            <div class="vein-action">КОПАТЬ</div>
                        </div>
                    </button>

                    <button class="mine-vein vein-gold" data-vein="gold">
                        <div class="vein-top">
                            <div class="vein-icon">🥇</div>
                            <div class="vein-name-block">
                                <div class="vein-name">Золотая жила</div>
                                <div class="vein-desc">Золото · Железо</div>
                            </div>
                        </div>
                        <div class="vein-bottom">
                            <div class="vein-cost">10 🧊</div>
                            <div class="vein-action">КОПАТЬ</div>
                        </div>
                    </button>

                </div>

                <!-- INVENTORY PREVIEW -->
                <div class="mine-inv">
                    <div class="mine-inv-title">В инвентаре</div>
                    <div class="mine-inv-list">
                        <div class="mine-inv-item">
                            <span class="mine-inv-emoji">🪨</span>
                            <span class="mine-inv-count" id="inv-stone">0</span>
                        </div>
                        <div class="mine-inv-item">
                            <span class="mine-inv-emoji">⬛</span>
                            <span class="mine-inv-count" id="inv-coal">0</span>
                        </div>
                        <div class="mine-inv-item">
                            <span class="mine-inv-emoji">⚙️</span>
                            <span class="mine-inv-count" id="inv-iron">0</span>
                        </div>
                        <div class="mine-inv-item">
                            <span class="mine-inv-emoji">🥇</span>
                            <span class="mine-inv-count" id="inv-gold">0</span>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <!-- BOTTOM NAV -->
        <nav id="bottom-nav">
            <button class="nav-item" data-screen="invest" aria-label="Инвестиции">
                <span class="nav-emoji">📈</span>
                <span class="nav-label">Инвест</span>
            </button>
            <button class="nav-item" data-screen="business" aria-label="Бизнес">
                <span class="nav-emoji">💼</span>
                <span class="nav-label">Бизнес</span>
            </button>
            <button class="nav-item" data-screen="earn" aria-label="Заработок">
                <span class="nav-emoji">💵</span>
                <span class="nav-label">Заработок</span>
            </button>
            <button class="nav-item active" data-screen="berloga" aria-label="Берлога">
                <span class="nav-emoji">🏔️</span>
                <span class="nav-label">Берлога</span>
            </button>
            <button class="nav-item" data-screen="profile" aria-label="Профиль">
                <span class="nav-emoji">👤</span>
                <span class="nav-label">Профиль</span>
            </button>
        </nav>
    </div>

    <script>
        (function() {
            const PLAYER_KEY = 'lokhmaty_player_v1';
            const INV_KEY = 'lokhmaty_inventory_v1';

            // ====== КОНФИГ ЖИЛ ======
            const VEINS = {
                stone: {
                    id: 'stone',
                    name: 'Каменная жила',
                    icon: '🪨',
                    cost: 1,
                    drops: [
                        { id: 'stone', min: 1, max: 2, chance: 0.70 },
                        { id: 'stone', min: 2, max: 3, chance: 0.25 },
                        { id: 'coal',  min: 1, max: 1, chance: 0.05 },
                    ],
                },
                iron: {
                    id: 'iron',
                    name: 'Железная жила',
                    icon: '⚙️',
                    cost: 3,
                    drops: [
                        { id: 'iron_ore', min: 1, max: 1, chance: 0.50 },
                        { id: 'iron_ore', min: 2, max: 2, chance: 0.30 },
                        { id: 'coal',     min: 2, max: 3, chance: 0.15 },
                        { id: 'gold_ore', min: 1, max: 1, chance: 0.05 },
                    ],
                },
                gold: {
                    id: 'gold',
                    name: 'Золотая жила',
                    icon: '🥇',
                    cost: 10,
                    drops: [
                        { id: 'iron_ore', min: 2, max: 3, chance: 0.60 },
                        { id: 'gold_ore', min: 1, max: 1, chance: 0.30 },
                        { id: 'gold_ore', min: 2, max: 2, chance: 0.10 },
                    ],
                },
            };

            const ITEM_META = {
                stone:    { name: 'Камень',   emoji: '🪨', color: '#C0C0C0' },
                coal:     { name: 'Уголь',    emoji: '⬛', color: '#A0A0A0' },
                iron_ore: { name: 'Железо',   emoji: '⚙️', color: '#A8B0B8' },
                gold_ore: { name: 'Золото',   emoji: '🥇', color: '#FFD56B' },
                leaf:     { name: 'Лист',     emoji: '🍃', color: '#7DDFA0' },
            };

            const player = { wallet: 0, ice: 0, totalXp: 0 };
            const inventory = { stone: 0, coal: 0, iron_ore: 0, gold_ore: 0, leaf: 0 };

            const balanceValue = document.getElementById('balance-value');
            const xpFill = document.getElementById('xp-fill');
            const xpText = document.getElementById('xp-text');
            const playerLevelEl = document.getElementById('player-level');
            const iceValueEl = document.getElementById('mine-ice-value');

            const invStoneEl = document.getElementById('inv-stone');
            const invCoalEl  = document.getElementById('inv-coal');
            const invIronEl  = document.getElementById('inv-iron');
            const invGoldEl  = document.getElementById('inv-gold');

            const veinButtons = document.querySelectorAll('.mine-vein');
            const navItems = document.querySelectorAll('.nav-item');

            function cumulativeXp(level) {
                let total = 0;
                for (let i = 1; i < level; i++) total += i * 100;
                return total;
            }
            function getLevelInfo(totalXp) {
                let level = 1;
                while (cumulativeXp(level + 1) <= totalXp) level++;
                const base = cumulativeXp(level);
                const next = cumulativeXp(level + 1);
                return { level, currentInLevel: totalXp - base, needForLevel: next - base };
            }

            function formatNumber(num) {
                num = Math.floor(num);
                return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            }

            function savePlayer() {
                try {
                    const raw = localStorage.getItem(PLAYER_KEY);
                    const existing = raw ? JSON.parse(raw) : {};
                    existing.wallet = player.wallet;
                    existing.ice = player.ice;
                    existing.totalXp = player.totalXp;
                    localStorage.setItem(PLAYER_KEY, JSON.stringify(existing));
                } catch (e) {}
            }

            function saveInventory() {
                try {
                    localStorage.setItem(INV_KEY, JSON.stringify(inventory));
                } catch (e) {}
            }

            function loadAll() {
                try {
                    const rawP = localStorage.getItem(PLAYER_KEY);
                    if (rawP) {
                        const p = JSON.parse(rawP);
                        if (typeof p.wallet === 'number') player.wallet = p.wallet;
                        if (typeof p.ice === 'number') player.ice = p.ice;
                        if (typeof p.totalXp === 'number') player.totalXp = p.totalXp;
                    }
                    const rawI = localStorage.getItem(INV_KEY);
                    if (rawI) {
                        const inv = JSON.parse(rawI);
                        for (const id in inventory) {
                            if (typeof inv[id] === 'number') inventory[id] = inv[id];
                        }
                    }
                } catch (e) {}
            }

            function renderTop() {
                balanceValue.textContent = formatNumber(player.wallet);
                iceValueEl.textContent = formatNumber(player.ice);

                const info = getLevelInfo(player.totalXp);
                const percent = Math.min((info.currentInLevel / info.needForLevel) * 100, 100);
                xpFill.style.width = percent + '%';
                xpText.textContent = formatNumber(info.currentInLevel) + ' / ' + formatNumber(info.needForLevel);
                playerLevelEl.textContent = 'Уровень ' + info.level;
            }

            function renderInventoryPreview() {
                invStoneEl.textContent = formatNumber(inventory.stone || 0);
                invCoalEl.textContent  = formatNumber(inventory.coal || 0);
                invIronEl.textContent  = formatNumber(inventory.iron_ore || 0);
                invGoldEl.textContent  = formatNumber(inventory.gold_ore || 0);
            }

            function updateVeinStates() {
                veinButtons.forEach(btn => {
                    const veinId = btn.dataset.vein;
                    const cfg = VEINS[veinId];
                    if (!cfg) return;
                    const canAfford = player.ice >= cfg.cost;
                    btn.classList.toggle('disabled', !canAfford);
                });
            }

            function rollDrop(drops) {
                const r = Math.random();
                let cumulative = 0;
                for (const d of drops) {
                    cumulative += d.chance;
                    if (r < cumulative) return d;
                }
                return drops[0];
            }

            function spawnFloat(x, y, text, color) {
                const el = document.createElement('div');
                el.className = 'mine-float';
                el.textContent = text;
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                if (color) el.style.color = color;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1100);
            }

            function handleVeinClick(e, btn) {
                const veinId = btn.dataset.vein;
                const cfg = VEINS[veinId];
                if (!cfg) return;

                if (player.ice < cfg.cost) {
                    btn.classList.add('shake');
                    setTimeout(() => btn.classList.remove('shake'), 400);
                    return;
                }

                // Списываем лёд
                player.ice -= cfg.cost;
                savePlayer();

                // Роллим дроп
                const drop = rollDrop(cfg.drops);
                const qty = drop.min + Math.floor(Math.random() * (drop.max - drop.min + 1));

                inventory[drop.id] = (inventory[drop.id] || 0) + qty;
                saveInventory();

                // Позиция для float-текста
                const rect = btn.getBoundingClientRect();
                let x, y;
                if (e.touches && e.touches[0]) {
                    x = e.touches[0].clientX;
                    y = e.touches[0].clientY;
                } else if (e.changedTouches && e.changedTouches[0]) {
                    x = e.changedTouches[0].clientX;
                    y = e.changedTouches[0].clientY;
                } else if (typeof e.clientX === 'number' && e.clientX > 0) {
                    x = e.clientX;
                    y = e.clientY;
                } else {
                    x = rect.left + rect.width / 2;
                    y = rect.top + 10;
                }

                const meta = ITEM_META[drop.id] || { emoji: '?', color: '#FFF' };
                spawnFloat(x, y, '+' + qty + ' ' + meta.emoji, meta.color);

                // Визуальный отклик
                btn.classList.add('mined');
                setTimeout(() => btn.classList.remove('mined'), 200);

                renderTop();
                renderInventoryPreview();
                updateVeinStates();
            }

            veinButtons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    handleVeinClick(e, this);
                });
                btn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    handleVeinClick(e, this);
                }, { passive: false });
            });

            navItems.forEach(item => {
                const go = function(e) {
                    e.preventDefault();
                    savePlayer();
                    saveInventory();

                    const screen = this.dataset.screen;
                    if (screen === 'business') {
                        window.location.href = 'business.html';
                        return;
                    }
                    if (screen === 'berloga') {
                        window.location.href = 'index.html#berloga';
                        return;
                    }
                    if (screen === 'earn') {
                        window.location.href = 'index.html#earn';
                        return;
                    }
                    if (screen === 'invest') {
                        window.location.href = 'index.html#invest';
                        return;
                    }
                    if (screen === 'profile') {
                        window.location.href = 'index.html#profile';
                        return;
                    }
                };
                item.addEventListener('click', go);
                item.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    go.call(this, e);
                }, { passive: false });
            });

            function init() {
                loadAll();
                renderTop();
                renderInventoryPreview();
                updateVeinStates();
            }
            init();

            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                    loadAll();
                    renderTop();
                    renderInventoryPreview();
                    updateVeinStates();
                }
            });

            window.addEventListener('focus', function() {
                loadAll();
                renderTop();
                renderInventoryPreview();
                updateVeinStates();
            });

            window.addEventListener('beforeunload', function() {
                savePlayer();
                saveInventory();
            });

            function handleSafeArea() {
                const bottomNav = document.getElementById('bottom-nav');
                const safeBottom = getComputedStyle(document.documentElement)
                    .getPropertyValue('env(safe-area-inset-bottom)');
                if (safeBottom && safeBottom !== '0px') {
                    bottomNav.style.paddingBottom = safeBottom;
                }
            }
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', handleSafeArea);
            }
            handleSafeArea();

            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });
        })();
    </script>
</body>
</html>
