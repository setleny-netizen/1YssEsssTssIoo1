<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Колоть ледник — Лохматый клуб</title>
    <link rel="stylesheet" href="style.css?v=20">
</head>
<body>
    <div id="app">
        <!-- TOP PANEL -->
        <header id="top-panel">
            <div class="top-row">
                <div class="player-info">
                    <div class="avatar">
                        <div class="avatar-inner">
                            <svg class="icon icon--avatar" viewBox="0 0 40 40" aria-hidden="true"><use href="assets/icons.svg#i-avatar-yeti"></use></svg>
                        </div>
                    </div>
                    <div class="player-name-level">
                        <div class="player-name" id="player-name">Игрок</div>
                        <div class="player-level" id="player-level">Уровень 1</div>
                    </div>
                </div>
                <div class="balance-badge-group">
                    <div class="balance-badge" id="balance-badge">
                        <svg class="icon icon--top wallet-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-balance-coin"></use></svg>
                        <span class="balance-value" id="balance-value">0</span>
                    </div>
                </div>
            </div>
            <div class="xp-row">
                <span class="xp-label">XP</span>
                <div class="xp-bar">
                    <div class="xp-bar-fill" id="xp-fill"></div>
                </div>
                <span class="xp-text" id="xp-text">0 / 100</span>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <main id="content">
            <div id="screen-icebreak" class="screen-content icebreak-screen">

                <!-- TOPBAR -->
                <div class="icebreak-topbar">
                    <div class="icebreak-title">Ледник</div>
                    <div class="icebreak-ice-badge">
                        <svg class="icon icon--top icebreak-ice-emoji" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-ice-cube"></use></svg>
                        <span class="icebreak-ice-value" id="icebreak-ice-value">0</span>
                    </div>
                </div>

                <!-- ENERGY BAR -->
                <div class="icebreak-energy">
                    <div class="energy-label">
                        <span>
                            <svg class="icon icon--top" viewBox="0 0 24 24" aria-hidden="true" style="margin-right:4px;color:var(--accent-orange-light)"><use href="assets/icons.svg#i-energy"></use></svg>
                            Энергия
                        </span>
                        <span class="energy-count" id="energy-count">200 / 200</span>
                    </div>
                    <div class="energy-bar">
                        <div class="energy-bar-fill" id="energy-fill"></div>
                    </div>
                </div>

                <!-- SCENE: SVG-айсберг + кирка -->
                <div class="icebreak-scene" id="icebreak-scene">

                    <div class="iceberg-wrap" id="icebergWrap">
                        <svg class="iceberg-svg" id="icebergSvg" viewBox="0 0 400 420"
                             xmlns="http://www.w3.org/2000/svg" aria-label="Айсберг">
                            <defs>
                                <linearGradient id="iceBody" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%"   stop-color="#F2EFE6"/>
                                    <stop offset="30%"  stop-color="#DCEEF8"/>
                                    <stop offset="60%"  stop-color="#9CC7E0"/>
                                    <stop offset="85%"  stop-color="#4A7BA3"/>
                                    <stop offset="100%" stop-color="#1B2A41"/>
                                </linearGradient>
                                <linearGradient id="iceShine" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.95"/>
                                    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                                </linearGradient>
                                <linearGradient id="iceShadow" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%"   stop-color="#243B55" stop-opacity="0.55"/>
                                    <stop offset="100%" stop-color="#1B2A41" stop-opacity="0.85"/>
                                </linearGradient>
                                <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%"   stop-color="#7FB8D9" stop-opacity="0.55"/>
                                    <stop offset="100%" stop-color="#1B2A41" stop-opacity="0"/>
                                </linearGradient>
                                <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
                                    <feGaussianBlur stdDeviation="3"/>
                                </filter>
                            </defs>

                            <ellipse cx="200" cy="355" rx="130" ry="14"
                                     fill="#1B2A41" opacity="0.55"
                                     filter="url(#softBlur)" pointer-events="none"/>

                            <g filter="url(#softBlur)" opacity="0.55" pointer-events="none">
                                <path d="M 60 320 L 100 360 L 200 370 L 300 355 L 340 320 L 340 380 L 60 380 Z"
                                      fill="url(#reflection)"/>
                            </g>

                            <path d="M 60 320 L 90 260 L 130 200 L 170 150 L 195 90 L 210 60
                                     L 225 100 L 240 130 L 270 150 L 300 180 L 330 230 L 345 280
                                     L 340 320 L 200 330 L 100 325 Z"
                                  fill="url(#iceBody)"/>

                            <path d="M 60 320 L 90 260 L 130 200 L 170 150 L 195 90 L 210 60
                                     L 200 130 L 175 200 L 140 270 L 110 320 Z"
                                  fill="url(#iceShine)" opacity="0.7"/>

                            <path d="M 225 100 L 240 130 L 270 150 L 300 180 L 330 230 L 345 280
                                     L 340 320 L 260 325 L 250 230 L 235 160 Z"
                                  fill="url(#iceShadow)"/>

                            <g stroke="#7FB8D9" stroke-width="1.2" fill="none" opacity="0.55" pointer-events="none">
                                <path d="M 210 60 L 205 130 L 220 180 L 200 250 L 215 320"/>
                                <path d="M 175 200 L 200 220 L 240 230"/>
                                <path d="M 130 200 L 160 240 L 150 300"/>
                                <path d="M 300 180 L 285 240 L 305 300"/>
                            </g>

                            <g stroke="#1B2A41" stroke-width="1" opacity="0.45" pointer-events="none">
                                <line x1="120" y1="270" x2="118" y2="322"/>
                                <line x1="150" y1="280" x2="148" y2="324"/>
                                <line x1="185" y1="285" x2="183" y2="326"/>
                                <line x1="225" y1="290" x2="223" y2="325"/>
                                <line x1="260" y1="290" x2="258" y2="323"/>
                                <line x1="295" y1="285" x2="293" y2="320"/>
                            </g>

                            <line x1="40" y1="325" x2="360" y2="325"
                                  stroke="#7FB8D9" stroke-width="1.2" opacity="0.5"
                                  pointer-events="none"/>

                            <g fill="#FFFFFF" opacity="0.9" pointer-events="none">
                                <circle cx="180" cy="140" r="1.2"/>
                                <circle cx="205" cy="170" r="1"/>
                                <circle cx="230" cy="200" r="1.1"/>
                                <circle cx="160" cy="230" r="1"/>
                                <circle cx="280" cy="220" r="1.2"/>
                                <circle cx="310" cy="260" r="1"/>
                            </g>
                        </svg>
                    </div>

                    <div class="pickaxe" id="pickaxe">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-pickaxe-big"></use></svg>
                    </div>

                </div>

                <!-- HINT -->
                <div class="icebreak-hint">Тапай по леднику чтобы колоть</div>

                <!-- PICKAXE INFO -->
                <div class="pickaxe-info" id="pickaxe-info">
                    <div class="pickaxe-info-left">
                        <div class="pickaxe-info-title">
                            <svg class="icon icon--top" viewBox="0 0 24 24" aria-hidden="true" style="margin-right:4px;color:var(--accent-orange-light)"><use href="assets/icons.svg#i-pickaxe"></use></svg>
                            КИРКА · УР. <span id="pickaxe-level">1</span>
                        </div>
                        <div class="pickaxe-info-sub">
                            <span id="pickaxe-drop">+1</span> при удаче · 25%
                        </div>
                    </div>
                    <button class="pickaxe-upgrade-btn" id="pickaxe-upgrade-btn">
                        <div class="pickaxe-upg-title">УЛУЧШИТЬ</div>
                        <div class="pickaxe-upg-cost" id="pickaxe-upg-cost">$ 3 000</div>
                    </button>
                </div>

            </div>
        </main>

        <!-- BOTTOM NAV -->
        <nav id="bottom-nav">
            <button class="nav-item" data-screen="invest" aria-label="Инвестиции">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-invest"></use></svg>
                <span class="nav-label">Инвест</span>
            </button>
            <button class="nav-item" data-screen="business" aria-label="Бизнес">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-business"></use></svg>
                <span class="nav-label">Бизнес</span>
            </button>
            <button class="nav-item active" data-screen="earn" aria-label="Заработок">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-earn"></use></svg>
                <span class="nav-label">Заработок</span>
            </button>
            <button class="nav-item" data-screen="berloga" aria-label="Берлога">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-berloga"></use></svg>
                <span class="nav-label">Берлога</span>
            </button>
            <button class="nav-item" data-screen="profile" aria-label="Профиль">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-profile"></use></svg>
                <span class="nav-label">Профиль</span>
            </button>
        </nav>
    </div>

    <!-- Слой для кубиков -->
    <div class="cubes-layer" id="cubesLayer"></div>

    <script>
        (function() {
            const PLAYER_KEY = 'lokhmaty_player_v1';
            const PICKAXE_KEY = 'lokhmaty_pickaxe_v1';

            const PICKAXE_LEVELS = {
                1: { level: 1, drop: 1, upgradeCost: 1500 },
                2: { level: 2, drop: 2, upgradeCost: 3000 },
                3: { level: 3, drop: 3, upgradeCost: 15000 },
                4: { level: 4, drop: 4, upgradeCost: 75000 },
                5: { level: 5, drop: 5, upgradeCost: 500000 },
            };
            const MAX_PICKAXE = 5;

            const SUCCESS_CHANCE = 0.25;
            const STRIKE_COST = 1;

            const MAX_ENERGY = 200;
            const ENERGY_REGEN_SEC = 60;

            const player = { wallet: 0, ice: 0, totalXp: 0 };
            const pickaxe = {
                level: 1,
                energy: MAX_ENERGY,
                lastEnergyUpdate: Date.now(),
            };

            const balanceValue = document.getElementById('balance-value');
            const balanceBadge = document.getElementById('balance-badge');
            const xpFill = document.getElementById('xp-fill');
            const xpText = document.getElementById('xp-text');
            const playerLevelEl = document.getElementById('player-level');
            const iceValueEl = document.getElementById('icebreak-ice-value');

            const scene = document.getElementById('icebreak-scene');
            const wrap = document.getElementById('icebergWrap');
            const pickaxeEl = document.getElementById('pickaxe');
            const cubesLayer = document.getElementById('cubesLayer');

            const energyCountEl = document.getElementById('energy-count');
            const energyFillEl = document.getElementById('energy-fill');

            const pickaxeLevelEl = document.getElementById('pickaxe-level');
            const pickaxeDropEl = document.getElementById('pickaxe-drop');
            const upgradeBtn = document.getElementById('pickaxe-upgrade-btn');
            const upgradeCostEl = document.getElementById('pickaxe-upg-cost');

            const navItems = document.querySelectorAll('.nav-item');

            // ====== XP ======
            function cumulativeXp(level) {
                let total = 0;
                for (let i = 1; i < level; i++) total += i * 100;
                return total;
            }
            function getLevelInfo(totalXp) {
                let level = 1;
                while (cumulativeXp(level + 1) <= totalXp) level++;
                const base = cumulativeXp(level);
                const next = cumulativeXp(level + 1);
                return { level, currentInLevel: totalXp - base, needForLevel: next - base };
            }

            // ====== ФОРМАТ ======
            function formatNumber(num) {
                num = Math.floor(num);
                return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            }
            function formatMoney(num) {
                const n = Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
                return '$ ' + n;
            }

            // ====== СОХРАНЕНИЕ ======
            function savePlayer() {
                try {
                    const raw = localStorage.getItem(PLAYER_KEY);
                    const existing = raw ? JSON.parse(raw) : {};
                    existing.wallet = player.wallet;
                    existing.ice = player.ice;
                    existing.totalXp = player.totalXp;
                    localStorage.setItem(PLAYER_KEY, JSON.stringify(existing));
                } catch (e) {}
            }
            function savePickaxe() {
                try {
                    localStorage.setItem(PICKAXE_KEY, JSON.stringify({
                        level: pickaxe.level,
                        energy: pickaxe.energy,
                        lastEnergyUpdate: pickaxe.lastEnergyUpdate,
                    }));
                } catch (e) {}
            }
            function loadAll() {
                try {
                    const rawP = localStorage.getItem(PLAYER_KEY);
                    if (rawP) {
                        const p = JSON.parse(rawP);
                        if (typeof p.wallet === 'number') player.wallet = p.wallet;
                        if (typeof p.ice === 'number') player.ice = p.ice;
                        if (typeof p.totalXp === 'number') player.totalXp = p.totalXp;
                    } else {
                        player.wallet = 0;
                        player.ice = 1000;
                        player.totalXp = 0;
                        savePlayer();
                    }
                    const rawK = localStorage.getItem(PICKAXE_KEY);
                    if (rawK) {
                        const k = JSON.parse(rawK);
                        if (typeof k.level === 'number' && PICKAXE_LEVELS[k.level]) pickaxe.level = k.level;
                        if (typeof k.energy === 'number') pickaxe.energy = k.energy;
                        if (typeof k.lastEnergyUpdate === 'number') pickaxe.lastEnergyUpdate = k.lastEnergyUpdate;
                    }
                } catch (e) {}
            }

            // ====== ЭНЕРГИЯ ======
            function regenerateEnergy() {
                const now = Date.now();
                const elapsed = Math.floor((now - pickaxe.lastEnergyUpdate) / 1000);
                if (elapsed <= 0) return;
                const regen = Math.floor(elapsed / ENERGY_REGEN_SEC);
                if (regen <= 0) return;

                const before = pickaxe.energy;
                pickaxe.energy = Math.min(MAX_ENERGY, pickaxe.energy + regen);
                pickaxe.lastEnergyUpdate += regen * ENERGY_REGEN_SEC * 1000;

                if (pickaxe.energy !== before) savePickaxe();
                if (pickaxe.energy >= MAX_ENERGY) pickaxe.lastEnergyUpdate = now;
            }

            // ====== РЕНДЕР ======
            function renderTop() {
                balanceValue.textContent = formatNumber(player.wallet);
                iceValueEl.textContent = formatNumber(player.ice);

                const info = getLevelInfo(player.totalXp);
                const percent = Math.min((info.currentInLevel / info.needForLevel) * 100, 100);
                xpFill.style.width = percent + '%';
                xpText.textContent = formatNumber(info.currentInLevel) + ' / ' + formatNumber(info.needForLevel);
                playerLevelEl.textContent = 'Уровень ' + info.level;
            }

            function renderEnergy() {
                energyCountEl.textContent = pickaxe.energy + ' / ' + MAX_ENERGY;
                const pct = Math.min((pickaxe.energy / MAX_ENERGY) * 100, 100);
                energyFillEl.style.width = pct + '%';
                energyFillEl.classList.toggle('low', pct <= 20);
            }

            function renderPickaxe() {
                const cfg = PICKAXE_LEVELS[pickaxe.level];
                pickaxeLevelEl.textContent = cfg.level;
                pickaxeDropEl.textContent = '+' + cfg.drop;

                if (pickaxe.level >= MAX_PICKAXE) {
                    upgradeBtn.disabled = true;
                    upgradeCostEl.textContent = 'МАКС';
                    upgradeBtn.classList.add('maxed');
                } else {
                    upgradeBtn.disabled = false;
                    upgradeBtn.classList.remove('maxed');
                    upgradeCostEl.textContent = formatMoney(cfg.upgradeCost);
                }
            }

            function renderAll() {
                renderTop();
                renderEnergy();
                renderPickaxe();
            }

            // ====== ПУЛЬС БАЛАНСА ======
            function pulseBalance() {
                balanceValue.classList.remove('pulse');
                void balanceValue.offsetWidth;
                balanceValue.classList.add('pulse');
            }

            // ====== ЭФФЕКТЫ ======
            function spawnCrack(x, y) {
                const crack = document.createElement('div');
                crack.className = 'crack';
                crack.style.left = x + 'px';
                crack.style.top  = y + 'px';
                document.body.appendChild(crack);
                setTimeout(() => crack.remove(), 400);
            }

            // Кубик летит к бейджу баланса и начисляет лёд на animationend
            function spawnCube(startX, startY, reward) {
                const cube = document.createElement('div');
                cube.className = 'cube';
                cube.style.left = startX + 'px';
                cube.style.top  = startY + 'px';

                const target = balanceBadge.getBoundingClientRect();
                const targetX = target.left + target.width / 2;
                const targetY = target.top  + target.height / 2;

                const dx = targetX - startX;
                const dy = targetY - startY;
                const jitter = (Math.random() - 0.5) * 60;

                cube.style.setProperty('--dx', dx + 'px');
                cube.style.setProperty('--dy', dy + 'px');
                cube.style.setProperty('--jx', jitter + 'px');

                cubesLayer.appendChild(cube);

                cube.addEventListener('animationend', function() {
                    player.ice += reward;
                    savePlayer();
                    renderTop();
                    pulseBalance();
                    cube.remove();
                }, { once: true });
            }

            function shakeScene() {
                wrap.classList.remove('hit');
                void wrap.offsetWidth;
                wrap.classList.add('hit');
            }

            // ====== УДАР ======
            let strikeResetTimer = null;
            let lastStrikeAt = 0;
            const STRIKE_COOLDOWN = 60;

            function strike(clientX, clientY) {
                const now = performance.now();
                if (now - lastStrikeAt < STRIKE_COOLDOWN) return;
                lastStrikeAt = now;

                if (pickaxe.energy < STRIKE_COST) {
                    shakeScene();
                    return;
                }

                // 1. Кирка: анимация удара
                if (strikeResetTimer) clearTimeout(strikeResetTimer);
                pickaxeEl.classList.remove('strike');
                void pickaxeEl.offsetWidth;
                pickaxeEl.classList.add('strike');
                strikeResetTimer = setTimeout(() => pickaxeEl.classList.remove('strike'), 260);

                // 2. Сцена: тряска
                shakeScene();

                // 3. Точка удара — по центру айсберга (или по клику)
                const rect = wrap.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;

                // 4. Списываем энергию
                pickaxe.energy -= STRIKE_COST;
                renderEnergy();
                savePickaxe();

                // 5. Крака
                setTimeout(() => spawnCrack(cx, cy), 130);

                // 6. Проверка шанса
                const win = Math.random() < SUCCESS_CHANCE;
                if (win) {
                    const drop = PICKAXE_LEVELS[pickaxe.level].drop;
                    setTimeout(() => spawnCube(cx, cy, drop), 150);
                }
            }

            // ====== АПГРЕЙД ======
            function upgradePickaxe() {
                if (pickaxe.level >= MAX_PICKAXE) return;
                const cfg = PICKAXE_LEVELS[pickaxe.level];
                if (player.wallet < cfg.upgradeCost) {
                    upgradeBtn.classList.add('shake');
                    setTimeout(() => upgradeBtn.classList.remove('shake'), 400);
                    return;
                }
                player.wallet -= cfg.upgradeCost;
                pickaxe.level += 1;
                savePlayer();
                savePickaxe();
                renderAll();
            }

            // ====== ОБРАБОТЧИКИ ======
            // Клик по сцене (сам айсберг pointer-events: none)
            scene.addEventListener('pointerdown', function(e) {
                e.preventDefault();
                strike(e.clientX, e.clientY);
            });

            upgradeBtn.addEventListener('click', function(e) {
                e.preventDefault();
                upgradePickaxe();
            });

            // ====== НАВИГАЦИЯ ======
            navItems.forEach(item => {
                const go = function(e) {
                    e.preventDefault();
                    savePlayer();
                    savePickaxe();

                    const screen = this.dataset.screen;
                    if (screen === 'business') { window.location.href = 'business.html'; return; }
                    if (screen === 'earn')     { window.location.href = 'index.html#earn';    return; }
                    if (screen === 'berloga')  { window.location.href = 'index.html#berloga'; return; }
                    if (screen === 'invest')   { window.location.href = 'index.html#invest';  return; }
                    if (screen === 'profile')  { window.location.href = 'index.html#profile'; return; }
                };
                item.addEventListener('click', go);
            });

            // ====== ИНИЦИАЛИЗАЦИЯ ======
            function init() {
                loadAll();
                regenerateEnergy();
                renderAll();
            }
            init();

            setInterval(function() {
                regenerateEnergy();
                renderEnergy();
                renderTop();
            }, 1000);

            setInterval(function() {
                savePlayer();
                savePickaxe();
            }, 10000);

            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'hidden') {
                    savePlayer();
                    savePickaxe();
                } else {
                    regenerateEnergy();
                    renderAll();
                }
            });

            window.addEventListener('beforeunload', function() {
                savePlayer();
                savePickaxe();
            });
        })();
    </script>
</body>
</html>
