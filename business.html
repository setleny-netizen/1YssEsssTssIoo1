<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Бизнес — Лохматый клуб</title>
    <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
    <div id="app">
        <!-- TOP PANEL -->
        <header id="top-panel">
            <div class="top-row">
                <div class="player-info">
                    <div class="avatar">
                        <div class="avatar-inner">
                            <svg class="icon icon--avatar" viewBox="0 0 40 40" aria-hidden="true"><use href="assets/icons.svg#i-avatar-yeti"></use></svg>
                        </div>
                    </div>
                    <div class="player-name-level">
                        <div class="player-name" id="player-name">Игрок</div>
                        <div class="player-level" id="player-level">Уровень 1</div>
                    </div>
                </div>
                <div class="balance-badge-group">
                    <div class="balance-badge">
                        <svg class="icon icon--top wallet-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-balance-coin"></use></svg>
                        <span class="balance-value" id="balance-value">0</span>
                    </div>
                </div>
            </div>
            <div class="xp-row">
                <span class="xp-label">XP</span>
                <div class="xp-bar">
                    <div class="xp-bar-fill" id="xp-fill"></div>
                </div>
                <span class="xp-text" id="xp-text">0 / 100</span>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <main id="content">
            <div id="screen-business" class="screen-content business-screen">

                <div class="biz-header">
                    <div class="biz-title">Бизнес</div>
                    <button class="biz-slot-btn" id="biz-slot-btn">
                        <svg class="icon icon--top" viewBox="0 0 24 24" aria-hidden="true" style="margin-right:6px"><use href="assets/icons.svg#i-slot-ticket"></use></svg>
                        Купить слот
                    </button>
                </div>

                <div class="biz-income-card">
                    <div class="biz-income-value" id="biz-income">$ 0</div>
                    <div class="biz-income-label">Суммарный доход в час</div>
                </div>

                <button class="biz-open-btn" id="biz-open-btn">Открыть бизнес</button>

                <div class="biz-my-header">
                    <div class="biz-my-title">Мои фирмы</div>
                    <div class="biz-my-count" id="biz-my-count">0 / 3</div>
                </div>

                <div class="biz-companies" id="biz-companies"></div>

            </div>
        </main>

        <!-- BOTTOM NAV -->
        <nav id="bottom-nav">
            <button class="nav-item" data-screen="invest" aria-label="Инвестиции">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-invest"></use></svg>
                <span class="nav-label">Инвест</span>
            </button>
            <button class="nav-item active" data-screen="business" aria-label="Бизнес">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-business"></use></svg>
                <span class="nav-label">Бизнес</span>
            </button>
            <button class="nav-item" data-screen="earn" aria-label="Заработок">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-earn"></use></svg>
                <span class="nav-label">Заработок</span>
            </button>
            <button class="nav-item" data-screen="berloga" aria-label="Берлога">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-berloga"></use></svg>
                <span class="nav-label">Берлога</span>
            </button>
            <button class="nav-item" data-screen="profile" aria-label="Профиль">
                <svg class="icon icon--nav nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-nav-profile"></use></svg>
                <span class="nav-label">Профиль</span>
            </button>
        </nav>

        <!-- MODAL: CATALOG -->
        <div class="modal-overlay hidden" id="modal-catalog">
            <div class="modal-sheet">
                <div class="modal-header">
                    <div class="modal-title">Открыть бизнес</div>
                    <button class="modal-close" data-close="modal-catalog" aria-label="Закрыть">
                        <svg class="icon icon--top" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-close"></use></svg>
                    </button>
                </div>
                <div class="modal-body" id="catalog-list"></div>
            </div>
        </div>

        <!-- MODAL: SLOTS -->
        <div class="modal-overlay hidden" id="modal-slots">
            <div class="modal-sheet">
                <div class="modal-header">
                    <div class="modal-title">Слоты для бизнеса</div>
                    <button class="modal-close" data-close="modal-slots" aria-label="Закрыть">
                        <svg class="icon icon--top" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-close"></use></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="slot-info">
                        <div class="slot-info-row">
                            <span>Занято слотов</span>
                            <strong id="slot-used">0 / 3</strong>
                        </div>
                        <div class="slot-info-row">
                            <span>Следующий слот</span>
                            <strong id="slot-next-price">$ 10 000</strong>
                        </div>
                    </div>
                    <button class="slot-buy-btn" id="slot-buy-btn">Купить слот</button>
                </div>
            </div>
        </div>

        <!-- MODAL: UPGRADE + SELL -->
        <div class="modal-overlay hidden" id="modal-upgrade">
            <div class="modal-sheet">
                <div class="modal-header">
                    <div class="modal-title" id="upg-title">Фирма</div>
                    <button class="modal-close" data-close="modal-upgrade" aria-label="Закрыть">
                        <svg class="icon icon--top" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-close"></use></svg>
                    </button>
                </div>
                <div class="modal-body" id="upg-body"></div>
            </div>
        </div>

    </div>

    <script>
        (function() {
            const PLAYER_KEY = 'lokhmaty_player_v1';
            const BIZ_KEY = 'lokhmaty_business_v4';

            const BUSINESSES = {
                shawarma: {
                    id: 'shawarma', name: 'Шаурмичная', icon: 'i-biz-shawarma', type: 'Общепит',
                    price: 5000, income: 50, maxLevel: 10,
                    upgradeCostMult: 2.2, incomeMult: 1.7,
                },
                taxi: {
                    id: 'taxi', name: 'Таксопарк', icon: 'i-biz-taxi', type: 'Транспорт',
                    price: 25000, income: 200, maxLevel: 10,
                    upgradeCostMult: 2.2, incomeMult: 1.75,
                },
                hotel: {
                    id: 'hotel', name: 'Отель', icon: 'i-biz-hotel', type: 'Недвижимость',
                    price: 150000, income: 1200, maxLevel: 10,
                    upgradeCostMult: 2.2, incomeMult: 1.8,
                },
                oil: {
                    id: 'oil', name: 'Нефтевышка', icon: 'i-biz-oil', type: 'Промышленность',
                    price: 800000, income: 6000, maxLevel: 10,
                    upgradeCostMult: 2.2, incomeMult: 1.85,
                },
                it: {
                    id: 'it', name: 'IT-Корпорация', icon: 'i-biz-it', type: 'Технологии',
                    price: 5000000, income: 35000, maxLevel: 10,
                    upgradeCostMult: 2.2, incomeMult: 1.9,
                },
            };

            const BASE_SLOTS = 3;
            const MAX_SLOTS = 10;
            const SELL_RATE = 0.8;

            function slotPrice(currentSlots) {
                const extra = currentSlots - BASE_SLOTS;
                return 10000 * Math.pow(5, extra);
            }

            function cumulativeXp(level) {
                let total = 0;
                for (let i = 1; i < level; i++) total += i * 100;
                return total;
            }
            function getLevelInfo(totalXp) {
                let level = 1;
                while (cumulativeXp(level + 1) <= totalXp) level++;
                const base = cumulativeXp(level);
                const next = cumulativeXp(level + 1);
                return { level, currentInLevel: totalXp - base, needForLevel: next - base };
            }

            const player = { wallet: 0, ice: 0, totalXp: 0 };
            const biz = {
                slots: BASE_SLOTS,
                owned: [], // [{ uid, id, level, lastUpdate }]
            };

            const balanceValue = document.getElementById('balance-value');
            const xpFill = document.getElementById('xp-fill');
            const xpText = document.getElementById('xp-text');
            const playerLevelEl = document.getElementById('player-level');

            const bizIncomeEl = document.getElementById('biz-income');
            const bizMyCountEl = document.getElementById('biz-my-count');
            const bizCompaniesEl = document.getElementById('biz-companies');

            const catalogList = document.getElementById('catalog-list');
            const slotUsedEl = document.getElementById('slot-used');
            const slotNextPriceEl = document.getElementById('slot-next-price');
            const slotBuyBtn = document.getElementById('slot-buy-btn');

            const upgTitleEl = document.getElementById('upg-title');
            const upgBodyEl = document.getElementById('upg-body');

            const navItems = document.querySelectorAll('.nav-item');

            let currentUpgradeUid = null;

            // ====== ХЕЛПЕР: SVG-ИКОНКА БИЗНЕСА ======
            function bizIcon(iconId, size) {
                size = size || 'icon--grid';
                return '<svg class="icon ' + size + '" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#' + iconId + '"></use></svg>';
            }

            // ====== ФОРМАТ ======
            function formatNumber(num) {
                num = Math.floor(num);
                return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            }
            function formatMoney(num) {
                const n = Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
                return '$ ' + n;
            }

            // ====== СОХРАНЕНИЕ ======
            function savePlayer() {
                try {
                    const raw = localStorage.getItem(PLAYER_KEY);
                    const existing = raw ? JSON.parse(raw) : {};
                    existing.wallet = player.wallet;
                    existing.ice = player.ice;
                    existing.totalXp = player.totalXp;
                    localStorage.setItem(PLAYER_KEY, JSON.stringify(existing));
                } catch (e) {}
            }
            function saveBiz() {
                try {
                    localStorage.setItem(BIZ_KEY, JSON.stringify({
                        slots: biz.slots, owned: biz.owned,
                    }));
                } catch (e) {}
            }
            function loadAll() {
                try {
                    const rawP = localStorage.getItem(PLAYER_KEY);
                    if (rawP) {
                        const p = JSON.parse(rawP);
                        if (typeof p.wallet === 'number') player.wallet = p.wallet;
                        if (typeof p.ice === 'number') player.ice = p.ice;
                        if (typeof p.totalXp === 'number') player.totalXp = p.totalXp;
                    } else {
                        player.wallet = 0;
                        player.ice = 1000;
                        player.totalXp = 0;
                        savePlayer();
                    }
                    const rawB = localStorage.getItem(BIZ_KEY);
                    if (rawB) {
                        const b = JSON.parse(rawB);
                        if (typeof b.slots === 'number') biz.slots = b.slots;
                        if (Array.isArray(b.owned)) biz.owned = b.owned;
                    }
                } catch (e) {}
            }

            // ====== РАСЧЁТЫ ======
            function ownedCount() { return biz.owned.length; }

            function findEntry(uid) {
                return biz.owned.find(e => e.uid === uid);
            }

            function incomeOf(entry) {
                const cfg = BUSINESSES[entry.id];
                if (!cfg) return 0;
                return cfg.income * Math.pow(cfg.incomeMult, entry.level - 1);
            }

            function incomePerHour() {
                let total = 0;
                for (const e of biz.owned) total += incomeOf(e);
                return total;
            }

            function upgradePriceFor(entry) {
                const cfg = BUSINESSES[entry.id];
                return Math.floor(cfg.price * Math.pow(cfg.upgradeCostMult, entry.level) * 0.5);
            }

            function totalInvested(entry) {
                const cfg = BUSINESSES[entry.id];
                let total = cfg.price;
                for (let lvl = 1; lvl < entry.level; lvl++) {
                    total += Math.floor(cfg.price * Math.pow(cfg.upgradeCostMult, lvl) * 0.5);
                }
                return total;
            }

            function sellPriceFor(entry) {
                return Math.floor(totalInvested(entry) * SELL_RATE);
            }

            // ====== ТИК ======
            function tickEntry(entry) {
                const now = Date.now();
                if (!entry.lastUpdate) entry.lastUpdate = now;
                const elapsedSec = (now - entry.lastUpdate) / 1000;
                if (elapsedSec <= 0) return;
                const incomePerSec = incomeOf(entry) / 3600;
                player.wallet += incomePerSec * elapsedSec;
                entry.lastUpdate = now;
            }

            function tickAll() {
                for (const e of biz.owned) tickEntry(e);
            }

            // ====== ОТРИСОВКА ======
            function renderTop() {
                balanceValue.textContent = formatNumber(player.wallet);
                const info = getLevelInfo(player.totalXp);
                const percent = Math.min((info.currentInLevel / info.needForLevel) * 100, 100);
                xpFill.style.width = percent + '%';
                xpText.textContent = formatNumber(info.currentInLevel) + ' / ' + formatNumber(info.needForLevel);
                playerLevelEl.textContent = 'Уровень ' + info.level;
            }

            function renderBusiness() {
                bizIncomeEl.textContent = formatMoney(incomePerHour());
                bizMyCountEl.textContent = ownedCount() + ' / ' + biz.slots;

                bizCompaniesEl.innerHTML = '';

                if (biz.owned.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'biz-empty';
                    empty.innerHTML = '<div class="biz-empty-emoji">' + bizIcon('i-briefcase', 'icon--hero') + '</div><div>У тебя пока нет фирм</div><div class="biz-empty-hint">Нажми «Открыть бизнес» чтобы купить первую</div>';
                    bizCompaniesEl.appendChild(empty);
                    return;
                }

                biz.owned.forEach(entry => {
                    bizCompaniesEl.appendChild(createOwnedCard(entry));
                });
            }

            function createOwnedCard(entry) {
                const cfg = BUSINESSES[entry.id];
                const income = incomeOf(entry);

                const card = document.createElement('div');
                card.className = 'biz-card';
                card.dataset.uid = entry.uid;
                card.innerHTML =
                    '<div class="biz-card-icon">' + bizIcon(cfg.icon, 'icon--grid') + '</div>' +
                    '<div class="biz-card-info">' +
                        '<div class="biz-card-name">' + cfg.name + '</div>' +
                        '<div class="biz-card-type">Ур. ' + entry.level + ' / ' + cfg.maxLevel + ' · ' + cfg.type + '</div>' +
                    '</div>' +
                    '<div class="biz-card-right">' +
                        '<div class="biz-card-income">' + formatMoney(income) + '</div>' +
                        '<div class="biz-card-income-label">в час</div>' +
                    '</div>';
                return card;
            }

            // ====== КАТАЛОГ ======
            function renderCatalog() {
                catalogList.innerHTML = '';
                const freeSlots = biz.slots - ownedCount();

                Object.values(BUSINESSES).forEach(cfg => {
                    const card = document.createElement('div');
                    card.className = 'cat-card';

                    let btnText, btnClass = 'cat-buy-btn';
                    if (freeSlots <= 0) {
                        btnText = 'Нет слотов';
                        btnClass += ' disabled';
                    } else if (player.wallet < cfg.price) {
                        btnText = 'Купить · ' + formatMoney(cfg.price);
                        btnClass += ' disabled';
                    } else {
                        btnText = 'Купить · ' + formatMoney(cfg.price);
                    }

                    card.innerHTML =
                        '<div class="cat-icon">' + bizIcon(cfg.icon, 'icon--grid') + '</div>' +
                        '<div class="cat-info">' +
                            '<div class="cat-name">' + cfg.name + '</div>' +
                            '<div class="cat-type">' + cfg.type + '</div>' +
                            '<div class="cat-income">' + formatMoney(cfg.income) + ' <span>в час</span></div>' +
                        '</div>' +
                        '<button class="' + btnClass + '" data-buy="' + cfg.id + '">' + btnText + '</button>';

                    catalogList.appendChild(card);
                });
            }

            // ====== МОДАЛКА ФИРМЫ ======
            function renderUpgrade(uid) {
                const entry = findEntry(uid);
                if (!entry) return;
                const cfg = BUSINESSES[entry.id];

                const lvl = entry.level;
                const nextLvl = lvl + 1;
                const isMax = lvl >= cfg.maxLevel;
                const curIncome = incomeOf(entry);
                const nextIncome = isMax ? curIncome : cfg.income * Math.pow(cfg.incomeMult, nextLvl - 1);
                const upgPrice = isMax ? 0 : upgradePriceFor(entry);
                const sellPrice = sellPriceFor(entry);
                const canUpgrade = !isMax && player.wallet >= upgPrice;

                upgTitleEl.textContent = cfg.name;

                let html = '';
                html += '<div class="upg-hero">';
                html += '<div class="upg-icon">' + bizIcon(cfg.icon, 'icon--hero') + '</div>';
                html += '<div class="upg-level">Уровень ' + lvl + ' / ' + cfg.maxLevel + '</div>';
                html += '</div>';

                html += '<div class="upg-stats">';
                html += '<div class="upg-stat"><span>Доход сейчас</span><strong>' + formatMoney(curIncome) + '/час</strong></div>';
                if (!isMax) {
                    html += '<div class="upg-stat next"><span>Доход после</span><strong>' + formatMoney(nextIncome) + '/час</strong></div>';
                }
                html += '</div>';

                html += '<div class="upg-actions">';
                if (isMax) {
                    html += '<div class="upg-max">Максимальный уровень</div>';
                } else {
                    html += '<button class="upg-buy-btn' + (canUpgrade ? '' : ' disabled') + '" id="upg-buy-btn"' + (canUpgrade ? '' : ' disabled') + '>Улучшить · ' + formatMoney(upgPrice) + '</button>';
                }
                html += '<button class="upg-sell-btn" id="upg-sell-btn">Продать · ' + formatMoney(sellPrice) + '</button>';
                html += '</div>';

                upgBodyEl.innerHTML = html;

                if (!isMax) {
                    const btn = document.getElementById('upg-buy-btn');
                    btn.addEventListener('click', function() {
                        if (!canUpgrade) {
                            this.classList.add('shake');
                            setTimeout(() => this.classList.remove('shake'), 400);
                            return;
                        }
                        tickEntry(entry);
                        player.wallet -= upgPrice;
                        entry.level = nextLvl;
                        entry.lastUpdate = Date.now();
                        savePlayer(); saveBiz();
                        renderTop(); renderBusiness();
                        renderUpgrade(uid);
                    });
                }

                const sellBtn = document.getElementById('upg-sell-btn');
                sellBtn.addEventListener('click', function() {
                    if (this.dataset.confirm === '1') {
                        sellBusiness(uid);
                    } else {
                        this.dataset.confirm = '1';
                        this.textContent = 'Точно продать? · ' + formatMoney(sellPrice);
                        this.classList.add('confirm');
                        setTimeout(() => {
                            if (this.isConnected) {
                                this.dataset.confirm = '';
                                this.textContent = 'Продать · ' + formatMoney(sellPrice);
                                this.classList.remove('confirm');
                            }
                        }, 3000);
                    }
                });
            }

            function openUpgrade(uid) {
                if (!findEntry(uid)) return;
                currentUpgradeUid = uid;
                renderUpgrade(uid);
                openModal('modal-upgrade');
            }

            // ====== ДЕЙСТВИЯ ======
            function buyBusiness(id) {
                const cfg = BUSINESSES[id];
                if (!cfg) return;
                if (player.wallet < cfg.price) return;
                if (biz.slots - ownedCount() <= 0) return;

                player.wallet -= cfg.price;
                biz.owned.push({
                    uid: Date.now() + '_' + Math.floor(Math.random() * 100000),
                    id: id,
                    level: 1,
                    lastUpdate: Date.now(),
                });
                savePlayer(); saveBiz();
                renderTop(); renderBusiness(); renderCatalog();
            }

            function sellBusiness(uid) {
                const idx = biz.owned.findIndex(e => e.uid === uid);
                if (idx === -1) return;
                const entry = biz.owned[idx];
                const refund = sellPriceFor(entry);
                tickEntry(entry);
                player.wallet += refund;
                biz.owned.splice(idx, 1);
                savePlayer(); saveBiz();
                renderTop(); renderBusiness();
                closeModal('modal-upgrade');
                currentUpgradeUid = null;
            }

            function buySlot() {
                if (biz.slots >= MAX_SLOTS) return;
                const price = slotPrice(biz.slots);
                if (player.wallet < price) {
                    slotBuyBtn.classList.add('shake');
                    setTimeout(() => slotBuyBtn.classList.remove('shake'), 400);
                    return;
                }
                player.wallet -= price;
                biz.slots += 1;
                savePlayer(); saveBiz();
                renderTop(); renderBusiness(); renderSlots();
            }

            // ====== МОДАЛКИ ======
            function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
            function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

            document.getElementById('biz-open-btn').addEventListener('click', function() {
                renderCatalog(); openModal('modal-catalog');
            });
            document.getElementById('biz-slot-btn').addEventListener('click', function() {
                renderSlots(); openModal('modal-slots');
            });
            document.querySelectorAll('[data-close]').forEach(btn => {
                btn.addEventListener('click', function() { closeModal(this.dataset.close); });
            });
            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', function(e) {
                    if (e.target === this) this.classList.add('hidden');
                });
            });

            catalogList.addEventListener('click', function(e) {
                const btn = e.target.closest('[data-buy]');
                if (!btn) return;
                if (btn.classList.contains('disabled') || btn.classList.contains('owned')) return;
                buyBusiness(btn.dataset.buy);
            });

            slotBuyBtn.addEventListener('click', buySlot);

            bizCompaniesEl.addEventListener('click', function(e) {
                const card = e.target.closest('.biz-card');
                if (card) openUpgrade(card.dataset.uid);
            });

            function renderSlots() {
                slotUsedEl.textContent = ownedCount() + ' / ' + biz.slots;
                if (biz.slots >= MAX_SLOTS) {
                    slotNextPriceEl.textContent = 'МАКС';
                    slotBuyBtn.disabled = true;
                    slotBuyBtn.textContent = 'Максимум слотов';
                } else {
                    const price = slotPrice(biz.slots);
                    slotNextPriceEl.textContent = formatMoney(price);
                    slotBuyBtn.disabled = player.wallet < price;
                    slotBuyBtn.textContent = 'Купить слот · ' + formatMoney(price);
                }
            }

            // ====== НАВИГАЦИЯ ======
            navItems.forEach(item => {
                const go = function(e) {
                    e.preventDefault();
                    tickAll();
                    saveBiz(); savePlayer();

                    const screen = this.dataset.screen;
                    if (screen === 'business') return;

                    if (screen === 'berloga') {
                        window.location.href = 'index.html#berloga';
                        return;
                    }
                    if (screen === 'earn') {
                        window.location.href = 'index.html#earn';
                        return;
                    }
                    if (screen === 'invest') {
                        window.location.href = 'index.html#invest';
                        return;
                    }
                    if (screen === 'profile') {
                        window.location.href = 'index.html#profile';
                        return;
                    }
                };
                item.addEventListener('click', go);
                item.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    go.call(this, e);
                }, { passive: false });
            });

            // ====== ИНИЦИАЛИЗАЦИЯ ======
            function init() {
                loadAll();
                tickAll();
                saveBiz();
                renderTop();
                renderBusiness();
            }
            init();

            setInterval(function() {
                tickAll();
                renderTop();
                renderBusiness();
                saveBiz();
                savePlayer();
            }, 1000);

            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'hidden') {
                    tickAll();
                    saveBiz(); savePlayer();
                } else {
                    loadAll();
                    tickAll();
                    renderTop();
                    renderBusiness();
                }
            });

            window.addEventListener('beforeunload', function() {
                tickAll();
                saveBiz(); savePlayer();
            });
        })();
    </script>
</body>
